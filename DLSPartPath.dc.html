        </sc-for>
        <sc-if value="{{ horizontal }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:24px">

              <sc-for list="{{ steps }}" as="st" hint-placeholder-count="6">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;}}">
const STEPS = [
  ['01', 'Купуємо авто', 'Купуємо авто після ДТП цілком. Тому знаємо пробіг, рік і що саме з ним сталося.'],
  ['02', 'Розбираємо', 'Розбираємо самі. Кожна деталь отримує свій номер і прив\u2019язку до авто-донора.'],
  ['03', 'Перевіряємо', 'Двигуни і коробки запускаємо на стенді, оптику та електрику перевіряємо на авто. Знімаємо відео.'],
  ['04', 'Позначаємо дефекти', 'Кожну подряпину обводимо білим маркером перед фото. Ви бачите стан до оплати, а не після.'],
  ['05', 'Публікуємо', 'Публікуємо з реальними фото, ціною та гарантією. Відео перевірки — в картці.'],
  ['06', 'Відправляємо', 'Відправляємо в день замовлення Новою поштою або Delivery. По Запоріжжю — самовивіз або доставка в бокс СТО.']
];
const STATIC = [0.5, 1.5, 2.5, 3.6, 4.5, 5.9];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const T = (s, k) => ease(clamp((s - k + 0.2) / 0.4));
const lerp = (a, b, t) => a + (b - a) * t;
const r2 = (n) => Math.round(n * 100) / 100;
const tr = (x, y) => 'translate(' + r2(x) + ' ' + r2(y) + ')';
const HEAD = [[174, 340, 0.8], [90, 250, 1], [400, 250, 5], [400, 280, 5], [400, 206, 4]];
const MARKS = [[-12, -5, 2.6], [8, 6, 2.2], [11, -5, 2.4]];

function scene(s) {
  const t1 = T(s, 1), t2 = T(s, 2), t3 = T(s, 3), t4 = T(s, 4), t5 = T(s, 5);
  const dim = clamp(1 - 0.8 * t2 - 0.2 * t3);
  let [hx, hy, hs] = HEAD[0];
  [t1, t2, t3, t4].forEach((t, i) => { hx = lerp(hx, HEAD[i + 1][0], t); hy = lerp(hy, HEAD[i + 1][1], t); hs = lerp(hs, HEAD[i + 1][2], t); });
  const k5 = 1 - 0.5 * t5;
  hx = 400 + (hx - 400) * k5; hy = 290 + (hy - 290) * k5; hs *= k5;
  const prog = [ease(clamp((s - 2.8) / 0.25)), ease(clamp((s - 2.95) / 0.25)), clamp((s - 3.2) / 0.55)];
  const out = {};
  MARKS.forEach(([lx, ly, lr], i) => {
    const r = lr * hs, c = 2 * Math.PI * r, n = i + 1;
    out['m' + n + 'x'] = r2(hx + lx * hs); out['m' + n + 'y'] = r2(hy + ly * hs); out['m' + n + 'r'] = r2(r);
    out['m' + n + 'd'] = r2(c) + ' ' + r2(c); out['m' + n + 'o'] = r2(c * (1 - prog[i]));
  });
  const a = prog[2] * Math.PI * 2;
  const bu = ease(clamp((s - 5.3) / 0.4));
  const bs = 0.6 + 0.4 * t5;
  const bx = 400 + 160 * bu;
  const done = s >= 5.72;
  const tx = bx - 90 * bs;
  const cs = (0.96 + 0.04 * t4) * k5;
  return {
    ...out,
    beamOp: r2(t2 * (1 - t3)), glowOp: r2(t2 * (1 - t3)),
    groundOp: r2(0.4 * dim),
    connOp: r2(0.6 * t1 * dim),
    bodyTf: tr(70 * t1, 0), bodyOp: r2(dim), partOp: r2(dim),
    doorTf: tr(80 * t1, -150 * t1), hoodTf: tr(-20 * t1, -150 * t1), bumperTf: tr(-80 * t1, 70 * t1),
    wheelTf: tr(lerp(230, 190, t1), lerp(400, 500, t1)),
    engineTf: tr(lerp(210, 130, t1), lerp(350, 360, t1)), engineOp: r2(t1 * dim),
    tagOp: r2(t1 * dim), headTagOp: r2(t1 * (1 - t2)),
    modelOp: r2(1 - t1),
    standOp: r2(t2 * (1 - t3)), checkOp: r2(t2 * (1 - t3)),
    headTf: tr(hx, hy) + ' scale(' + r2(hs) + ')', headOp: r2(1 - t5),
    markOp: r2((prog[0] > 0 ? 1 : 0) * (1 - t5)),
    penTf: tr(out.m3x + out.m3r * Math.cos(a), out.m3y + out.m3r * Math.sin(a)), penOp: r2(t3 * (1 - t4)),
    cardTf: 'translate(400 290) scale(' + r2(cs) + ') translate(-400 -290)', cardOp: r2(t4 * (1 - t5)),
    boxTf: tr(bx, 300) + ' scale(' + r2(bs) + ')', boxOp: r2(t5),
    boxFade: done ? 0 : 1, boxFadeS: done ? 0.96 : 1,
    sentOp: done ? 1 : 0, sentS: done ? 1 : 0.96,
    trailD: 'M300 ' + r2(300 + 70 * bs) + ' L' + r2(Math.max(300, tx)) + ' ' + r2(300 + 70 * bs),
    trailOp: done ? 0 : r2(t5 * (tx > 306 ? 1 : 0)),
    trailClip: done ? r2(Math.max(0, tx - 290) + 4) + 'px' : '0px'
  };
}

class Component extends DCLogic {
  state = { vw: null, s: 0, trackPx: 0 };
  rootRef = React.createRef();
  stickyRef = React.createRef();
  wide = true;

  componentDidMount() {
    this.onResize = () => { this.setState({ vw: window.innerWidth }); this.queue(); };
    this.onScroll = () => this.queue();
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
    cancelAnimationFrame(this.raf);
  }
  componentDidUpdate(pp, ps) { if (ps.trackPx !== this.state.trackPx) this.queue(); }
  queue() {
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => { this.raf = 0; this.measure(); });
  }
  measure() {
    const el = this.rootRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const st = this.stickyRef.current;
    const sh = st ? st.offsetHeight : vh;
    if (!this.wide) {
      const want = Math.round(sh + vh * 0.6 * 6);
      if (Math.abs(want - this.state.trackPx) > 2) { this.setState({ trackPx: want }); return; }
    }
    const total = r.height - sh;
    const s = total > 0 ? clamp(-r.top / total) * 6 : 0;
    if (Math.abs(s - this.state.s) > 0.0005) this.setState({ s });
  }
  goTo(k) {
    const el = this.rootRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const total = r.height - (this.stickyRef.current ? this.stickyRef.current.offsetHeight : window.innerHeight);
    window.scrollTo({ top: window.scrollY + r.top + total * (k + 0.5) / 6, behavior: 'smooth' });
  }

  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const wide = d === 'desktop' || d === 'laptop';
    const m = d === 'mobile';
    if (this.wide !== wide) { this.wide = wide; setTimeout(() => this.queue(), 0); }
    const s = this.state.s;
    const active = clamp(Math.floor(s), 0, 5);
    const steps = STEPS.map(([n, name, text], i) => {
      const cur = i === active, past = i < active;
      return {
        n, name, text,
        go: () => this.goTo(i),
        current: cur ? 'step' : 'false',
        dot: cur ? '#E0001B' : past ? '#FCFCFD' : '#4A5260',
        ring: cur ? '0 0 0 4px #12161C, 0 0 0 5px rgba(224,0,27,0.6)' : '0 0 0 4px #12161C',
        numC: cur ? '#FCFCFD' : past ? '#A9B0BB' : '#6B7380',
        nameC: cur ? '#FCFCFD' : past ? '#A9B0BB' : '#6B7380',
        fw: cur ? 600 : 400,
        op: cur ? 1 : 0,
        tf: cur ? 'translateY(0)' : i < active ? 'translateY(-12px)' : 'translateY(12px)',
        hidden: cur ? 'false' : 'true',
        mDot: cur ? '#E0001B' : past ? '#FCFCFD' : '#4A5260',
        mRing: cur ? '0 0 0 4px #12161C, 0 0 0 5px rgba(224,0,27,0.6)' : '0 0 0 4px #12161C',
        mNumC: cur ? '#FCFCFD' : '#6B7380'
      };
    });
    const sc = scene(s);
    const frames = [{ ...sc, tagOp2: wide ? sc.tagOp : 0, i: 0, label: STEPS[active][1], appearOp: 1, appearTf: 'none' }];
    return {
      rootRef: this.rootRef, stickyRef: this.stickyRef,
      boxMax: 'calc(1312px + ' + (d === 'desktop' ? 128 : m ? 32 : 64) + 'px)',
      trackH: wide ? '600vh' : (this.state.trackPx ? this.state.trackPx + 'px' : '400vh'),
      stickH: wide ? '100vh' : 'auto',
      secPb: wide ? '0px' : '75px',
      sceneH: wide ? 'auto' : '40vh',
      headPad: m ? '75px 16px 0' : '75px 32px 0',
      leftDisplay: wide ? 'flex' : 'none',
      pad: d === 'desktop' ? '64px' : d === 'laptop' ? '48px 32px' : m ? '24px 16px 0' : '32px 32px 0',
      cols: d === 'desktop' ? 'minmax(0, 40fr) minmax(0, 60fr)' : d === 'laptop' ? 'minmax(0, 45fr) minmax(0, 55fr)' : 'minmax(0, 1fr)',
      colGap: wide ? '48px' : '32px',
      leftGap: wide ? '48px' : '32px',
      h2Size: wide ? '40px' : d === 'tablet' ? '28px' : '24px',
      h3Size: wide ? (d === 'desktop' ? '28px' : '24px') : m ? '20px' : '24px',
      textSize: d === 'desktop' ? '18px' : m ? '14px' : '16px',
      vertical: wide, horizontal: !wide,
      lineFill: 'calc((100% - 36px) * ' + (active / 5) + ')',
      steps,
      frames,
      panelGap: m ? '48px' : '64px',
      sceneMax: wide ? 'calc(100vh - 128px)' : '45vh'
    };
  }
}
</script>
</body>
</html>
