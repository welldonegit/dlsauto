<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}@property --dlsA{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes dlsSpin{to{--dlsA:360deg}}@keyframes dlsStockPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.35;transform:scale(0.8)}}@keyframes dlsHeartPopA{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes dlsHeartPopB{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}</style>
<script src="./dls-fav.js"></script>
<script src="./dls-cart.js"></script>
<script src="./dls-compare.js"></script>
</helmet>
<article onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative;width:100%;height:100%;box-sizing:border-box;min-width:0;display:flex;font-family:'Golos Text',sans-serif;color:#1E232B;transform:{{ lift }};transition:{{ tLift }}">
  <div aria-hidden="true" style="position:absolute;top:-16px;left:-16px;right:-16px;bottom:{{ backBottom }};border-radius:16px;background:#FFFFFF;opacity:{{ backOpacity }};box-shadow:{{ shadow }};transform:{{ backScale }};transform-origin:50% 0;transition:{{ tBack }}"></div>
  <div style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="position:relative;aspect-ratio:4 / 5;overflow:hidden;border-radius:8px;background:#FFFFFF">
      <img src="{{ photoSrc }}" alt="{{ photoLabel }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:{{ photoOp }}">
      {{ frame }}
      <sc-if value="{{ hasOld }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:8px;background:#E0001B;font-size:14px;line-height:20px;font-weight:500;color:#FCFCFD">−20%</span></sc-if>
      <sc-if value="{{ sold }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:8px;background:#1E232B;font-size:14px;line-height:20px;font-weight:500;color:#FCFCFD">Продано</span></sc-if>
      <sc-if value="{{ showPopular }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:8px;background:#FCFCFD;font-size:14px;line-height:20px;font-weight:500;color:#1E232B">Популярне</span></sc-if>
      <div style="position:absolute;z-index:1;top:8px;right:8px;display:flex;flex-direction:column;gap:8px">
        <button onClick="{{ toggleFav }}" aria-label="{{ favLabel }}" aria-pressed="{{ fav }}" style="width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;color:{{ favColor }};cursor:pointer;background-color:#FCFCFD;background-image:radial-gradient(circle, #1E232B 0 49%, rgba(30,35,43,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="background-size:150% 150%;color:#FCFCFD" style-focus="outline:2px solid #1E232B;outline-offset:2px"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:{{ favFill }};stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:fill 200ms cubic-bezier(0.22, 1, 0.36, 1);animation:{{ favAnim }}"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></button>
        <button aria-label="Швидкий перегляд" onClick="{{ quickView }}" style="width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;color:#1E232B;cursor:pointer;background-color:#FCFCFD;background-image:radial-gradient(circle, #1E232B 0 49%, rgba(30,35,43,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="background-size:150% 150%;color:#FCFCFD" style-focus="outline:2px solid #1E232B;outline-offset:2px"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div style="opacity:{{ uiOpacity }};pointer-events:{{ uiEvents }};transition:{{ tUi }}">
        <button aria-label="Попереднє фото" onClick="{{ prevPhoto }}" style="position:absolute;top:50%;left:8px;width:32px;height:32px;margin-top:-16px;transform:{{ arrL }};transition:{{ tArr }};display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:#FCFCFD;color:#1E232B;cursor:pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button aria-label="Наступне фото" onClick="{{ nextPhoto }}" style="position:absolute;top:50%;right:8px;width:32px;height:32px;margin-top:-16px;transform:{{ arrR }};transition:{{ tArr }};display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:#FCFCFD;color:#1E232B;cursor:pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m9 18 6-6-6-6"></path></svg></button>
        <div style="position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
            <span style="width:8px;height:8px;border-radius:50%;background:{{ d.color }}"></span>
          </sc-for>
        </div>
      </div>
    </div>
    <sc-if value="{{ fits }}" hint-placeholder-val="{{ false }}">
      <span style="margin-top:16px;align-self:flex-start;max-width:100%;box-sizing:border-box;padding:4px 8px 4px 6px;display:flex;align-items:center;gap:6px;border-radius:8px;background:#F3F5F7">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="flex-shrink:0;fill:none;stroke:#1F8A4C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        <span style="min-width:0;font-size:13px;line-height:18px;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Підходить на ваше авто</span>
      </span>
    </sc-if>
    <sc-if value="{{ showDonor }}" hint-placeholder-val="{{ true }}">
      <span title="{{ donor }}" style="margin-top:16px;align-self:flex-start;max-width:100%;box-sizing:border-box;padding:4px 8px 4px 6px;display:flex;align-items:center;gap:6px;border-radius:8px;background:#F3F5F7">
        <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ true }}">
          <img src="{{ logoSrc }}" alt="" style="width:16px;height:16px;flex-shrink:0;object-fit:contain;display:block">
        </sc-if>
        <sc-if value="{{ noLogo }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="width:16px;height:16px;flex-shrink:0;box-sizing:border-box;border:1.5px solid #1E232B;border-radius:50%"></span>
        </sc-if>
        <span style="min-width:0;font-size:13px;line-height:18px;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ model }}</span>
      </span>
    </sc-if>
    <h3 title="{{ name }}" style="margin:8px 0 0;height:22px;font-size:16px;line-height:22px;font-weight:600;color:#1E232B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><a href="#" style="color:inherit;text-decoration:none">{{ name }}</a></h3>
    <p style="margin:4px 0 0;font-size:13px;line-height:18px;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Артикул: OEM {{ oem }}</p>
    <sc-if value="{{ notSold }}" hint-placeholder-val="{{ true }}"><p style="margin:4px 0 0;display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:#4A5260;white-space:nowrap">{{ stockDot }}<span>{{ stockText }}</span></p></sc-if>
    <div style="margin-top:auto;padding-top:16px;display:flex;align-items:flex-end;gap:8px">
      <div style="flex:1;min-width:0">
        <sc-if value="{{ hasOld }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0;font-size:13px;line-height:18px;color:#4A5260;text-decoration:line-through">{{ oldPrice }}</p>
        </sc-if>
        <sc-if value="{{ notSold }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-0.01em;color:{{ priceColor }};white-space:nowrap">{{ price }}</p></sc-if>
        <sc-if value="{{ sold }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;line-height:24px;color:#4A5260">Деталі вже немає</p></sc-if>
        <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><p style="margin:4px 0 0;font-size:13px;line-height:18px;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ note }}</p></sc-if>
      </div>
      <sc-if value="{{ showIconCart }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ addToCart }}" disabled="{{ inCart }}" aria-label="{{ cartLabel }}" style="width:40px;height:40px;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:{{ cartBg }};color:{{ cartColor }};cursor:{{ cartCursor }};transition:background 150ms ease-out, color 150ms ease-out" style-focus="outline:2px solid #1E232B;outline-offset:2px"><sc-if value="{{ notInCart }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg></sc-if><sc-if value="{{ inCart }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button>
      </sc-if>
    </div>
    <sc-if value="{{ showFullCart }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ addToCart }}" disabled="{{ inCart }}" aria-label="{{ cartLabel }}" style="margin-top:12px;width:100%;height:48px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:8px;font-family:inherit;font-size:16px;font-weight:600;color:{{ cartColor }};cursor:{{ cartCursor }};background-color:{{ cartBg }};background-image:radial-gradient(circle, {{ cartRipple }} 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), background-color 150ms ease-out, color 150ms ease-out" style-hover="background-size:300% 300%" style-focus="outline:2px solid #1E232B;outline-offset:2px">
        <sc-if value="{{ inCart }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
        <span>{{ cartText }}</span>
      </button>
    </sc-if>
    <sc-if value="{{ sold }}" hint-placeholder-val="{{ false }}">
      <a href="{{ similarHref }}" aria-label="{{ similarAria }}" style="margin-top:12px;width:100%;height:48px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:center;border:1px solid #E0001B;border-radius:8px;font-size:16px;font-weight:600;color:#E0001B;text-decoration:none;white-space:nowrap;background-color:transparent;background-image:radial-gradient(circle, rgba(224,0,27,0.08) 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="background-size:300% 300%" style-focus="outline:2px solid #1E232B;outline-offset:2px">Знайти схожу</a>
    </sc-if>
    <div style="position:absolute;top:calc(100% + 16px);left:0;right:0;opacity:{{ uiOpacity }};pointer-events:{{ uiEvents }};transform:{{ actShift }};transition:{{ tActions }}">
      <p style="margin:0;font-size:14px;line-height:20px;font-weight:600;color:#1E232B">Характеристики</p>
      <dl style="margin:8px 0 0;display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{ specList }}" as="sp" hint-placeholder-count="4">
          <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px">
            <dt style="min-width:0;flex:1;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sp.k }}</dt>
            <dd style="margin:0;flex-shrink:0;max-width:60%;color:#1E232B;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sp.v }}</dd>
          </div>
        </sc-for>
      </dl>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:640},&quot;donor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ford Ranger / Mazda BT-50 2006–2012&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;model&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ranger 2006–2012&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mitsubishi&quot;,&quot;ford&quot;,&quot;nissan&quot;,&quot;mazda&quot;,&quot;jeep&quot;,&quot;volkswagen&quot;,&quot;kia&quot;,&quot;hyundai&quot;,&quot;mercedes&quot;,&quot;toyota&quot;,&quot;volvo&quot;,&quot;bmw&quot;,&quot;peugeot&quot;,&quot;fiat&quot;,&quot;isuzu&quot;,&quot;ssangyong&quot;],&quot;default&quot;:&quot;ford&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;partName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Фара ліва галоген&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;UR56-51-040&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 500 ₴&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oldPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;popular&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fits&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;favorite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;demoHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;photos&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;specs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;[string, string]&gt;&quot;}}">
const LOGOS = ['mitsubishi', 'ford', 'nissan', 'mazda', 'jeep', 'volkswagen', 'kia', 'hyundai', 'mercedes', 'toyota', 'volvo', 'bmw', 'peugeot', 'fiat'];
const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const tr = (props, ms, delay = 0) => props.map(p => `${p} ${ms}ms ${EASE} ${delay}ms`).join(', ');

class Component extends DCLogic {
  state = { hovered: false, photo: 0, pop: 0 };
  componentDidMount() {
    const hookCmp = () => { if (window.DLSCompare) { this.unsubCmp = window.DLSCompare.subscribe(() => this.forceUpdate()); this.forceUpdate(); } else this.cmpRetry = setTimeout(hookCmp, 200); };
    hookCmp();
    if (window.DLSFav) this.unsub = window.DLSFav.subscribe(() => this.forceUpdate());
    else this.retry = setTimeout(() => { if (window.DLSFav) { this.unsub = window.DLSFav.subscribe(() => this.forceUpdate()); this.forceUpdate(); } }, 300);
    const hookCart = () => { if (window.DLSCart) { this.unsubCart = window.DLSCart.subscribe(e => { if (e.type === 'add' || e.type === 'remove') this.forceUpdate(); }); this.forceUpdate(); } else this.cartRetry = setTimeout(hookCart, 200); };
    hookCart();
  }
  componentWillUnmount() { this.unsubCmp && this.unsubCmp(); clearTimeout(this.cmpRetry); this.unsub && this.unsub(); this.unsubCart && this.unsubCart(); clearTimeout(this.retry); clearTimeout(this.cartRetry); }

  frame() {
    const mask = 'linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0)';
    return React.createElement('span', { 'aria-hidden': true, style: {
      position: 'absolute', inset: 0, padding: 2, boxSizing: 'border-box', borderRadius: 8, pointerEvents: 'none',
      background: 'conic-gradient(from var(--dlsA), rgba(224,0,27,0) 0deg, rgba(224,0,27,0) 144deg, #E0001B 360deg)',
      WebkitMask: mask, WebkitMaskComposite: 'xor', mask, maskComposite: 'exclude',
      animation: 'dlsSpin 3.5s linear infinite'
    } });
  }

  renderVals() {
    const p = this.props;
    const name = p.partName ?? 'Фара ліва галоген';
    const photos = p.photos ?? 6;
    const brand = p.brand ?? 'ford';
    const promo = !!p.oldPrice;
    const fits = !!p.fits;
    const hasLogo = LOGOS.includes(brand);
    const favId = p.itemId || p.oem || name;
    const store = typeof window !== 'undefined' ? window.DLSFav : null;
    const favMode = !!p.favMode;
    const sold = !!p.sold;
    const fullCart = !!p.fullCart;
    const fav = favMode || (store ? store.has(favId) : !!p.favorite);
    const hov = this.state.hovered || !!p.demoHover;
    const k = this.state.photo;
    const specs = (p.specs ?? [['Стан', 'Б/в, оригінал'], ['Гарантія', '14 днів'], ['Перевірка', 'Перевірено'], ['Сумісність', 'Ranger / BT-50']])
      .map(s => Array.isArray(s) ? { k: s[0], v: s[1] } : s);
    const setPhoto = d => this.setState(s => ({ photo: (s.photo + d + photos) % photos }));
    return {
      name, photos,
      donor: p.donor ?? 'Ford Ranger / Mazda BT-50 2006–2012',
      model: p.model ?? 'Ranger 2006–2012',
      oem: p.oem ?? 'UR56-51-040',
      price: p.price ?? '4 500 ₴',
      oldPrice: p.oldPrice, hasOld: promo && !sold,
      showPopular: !promo && !sold && !!p.popular,
      sold, notSold: !sold, photoOp: sold ? 0.5 : 1,
      showIconCart: !fullCart && !sold, showFullCart: fullCart && !sold,
      cartText: (window.DLSCart && window.DLSCart.has(favId)) ? 'У кошику' : 'В кошик',
      cartRipple: (window.DLSCart && window.DLSCart.has(favId)) ? 'rgba(0,0,0,0)' : '#C00017',
      similarHref: p.similarHref || '#',
      similarAria: `Знайти схожу: ${name}${p.donor ? ', ' + p.donor : ''}`,
      fits, showDonor: !fits,
      hasLogo, noLogo: !hasLogo,
      note: p.note || '', hasNote: !!p.note,
      logoSrc: `assets/logos/${brand}.svg`,
      photoSrc: this.props.photoSrc || 'assets/part-hub.webp',
      stockText: promo ? 'Залишок: 5 шт' : 'В наявності',
      stockDot: React.createElement('span', { key: promo ? 'low' : 'ok', 'aria-hidden': true, style: { width: 8, height: 8, flexShrink: 0, borderRadius: '50%', background: promo ? '#F59E0B' : '#1F8A4C', animation: 'dlsStockPulse 1.8s ease-in-out infinite' } }),
      priceColor: promo ? '#E0001B' : '#1E232B',
      frame: promo && !sold ? this.frame() : null,
      photoLabel: `Фото деталі: ${name.toLowerCase()} — ${k + 1} з ${photos}`,
      fav,
      favLabel: fav ? 'Прибрати з обраного' : 'Додати в обране',
      favColor: fav ? '#E0001B' : '#1E232B',
      favFill: fav ? '#E0001B' : 'none',
      toggleFav: () => {
        if (favMode) { p.onUnfav && p.onUnfav(); return; }
        if (!window.DLSFav) return;
        const item = { id: favId, name, photo: this.props.photoSrc || 'assets/part-hub.webp', donor: p.donor ?? '', model: p.model ?? '', brand, price: p.price ?? '', oldPrice: p.oldPrice || '', photos, specs: p.specs || null };
        if (!fav) this.setState(s => ({ pop: s.pop + 1 }));
        window.DLSFav.set(item, !fav);
      },
      inCart: !!(store && window.DLSCart && window.DLSCart.has(favId)),
      notInCart: !(store && window.DLSCart && window.DLSCart.has(favId)),
      cartLabel: (window.DLSCart && window.DLSCart.has(favId)) ? 'Уже в кошику' : 'Додати в кошик',
      cartBg: (window.DLSCart && window.DLSCart.has(favId)) ? '#E6E9EE' : '#E0001B',
      cartColor: (window.DLSCart && window.DLSCart.has(favId)) ? '#6B7380' : '#FCFCFD',
      cartCursor: (window.DLSCart && window.DLSCart.has(favId)) ? 'default' : 'pointer',
      addToCart: () => {
        const C = window.DLSCart; if (!C || C.has(favId)) return;
        C.add({ id: favId, name, donor: p.donor ?? '', oem: p.oem ?? '', price: parseInt(String(p.price ?? '0').replace(/\D/g, ''), 10) || 0, photo: this.props.photoSrc || 'assets/part-hub.webp' });
      },
      favAnim: this.state.pop && fav ? `${this.state.pop % 2 ? 'dlsHeartPopA' : 'dlsHeartPopB'} 300ms cubic-bezier(0.22, 1, 0.36, 1)` : 'none',
      quickView: () => { window.DLSQuickView && window.DLSQuickView.open({ id: favId, name, oem: p.oem ?? '', donor: p.donor ?? '', model: p.model ?? '', brand, price: p.price ?? '', oldPrice: p.oldPrice || '', photo: this.props.photoSrc || 'assets/part-hub.webp', specs: p.specs || null }); },
      cmp: !!(window.DLSCompare && window.DLSCompare.has(favId)),
      cmpColor: (window.DLSCompare && window.DLSCompare.has(favId)) ? '#E0001B' : '#1E232B',
      cmpLabel: (window.DLSCompare && window.DLSCompare.has(favId)) ? 'Прибрати з порівняння' : 'Додати до порівняння',
      toggleCmp: () => { const S = window.DLSCompare; if (!S) return; S.set({ id: favId, name, oem: p.oem ?? '', donor: p.donor ?? '', model: p.model ?? '', brand, price: p.price ?? '', photo: this.props.photoSrc || 'assets/part-hub.webp', specs: p.specs || null }, !S.has(favId)); },
      specList: specs,
      lift: hov ? 'translateY(-4px)' : 'none',
      backBottom: hov ? '-146px' : '-16px',
      backOpacity: hov ? 1 : 0,
      shadow: hov ? '0 4px 16px rgba(18,22,28,0.08)' : 'none',
      backScale: hov ? 'scale(1)' : 'scale(0.98)',
      arrL: hov ? 'none' : 'translateX(-8px)',
      arrR: hov ? 'none' : 'translateX(8px)',
      eyeShift: hov ? 'none' : 'translateY(-4px)',
      actShift: hov ? 'none' : 'translateY(8px)',
      tLift: tr(['transform'], hov ? 420 : 280),
      tBack: tr(['bottom', 'opacity', 'box-shadow', 'transform'], hov ? 420 : 280),
      tUi: tr(['opacity'], hov ? 320 : 160, hov ? 60 : 0),
      tEye: tr(['opacity', 'transform'], hov ? 360 : 160, hov ? 80 : 0) + ', background 150ms ease-out',
      tArr: tr(['transform'], hov ? 420 : 200, hov ? 60 : 0),
      tActions: tr(['opacity', 'transform'], hov ? 380 : 160, hov ? 100 : 0),
      uiOpacity: hov ? 1 : 0,
      uiEvents: hov ? 'auto' : 'none',
      uiTab: hov ? 0 : -1,
      dots: Array.from({ length: photos }, (_, j) => ({ color: j === k ? '#1E232B' : '#CDD2DA' })),
      prevPhoto: () => setPhoto(-1),
      nextPhoto: () => setPhoto(1),
      enter: () => this.setState({ hovered: true }),
      leave: () => this.setState({ hovered: false })
    };
  }
}
</script>
</body>
</html>
