<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<section aria-labelledby="brand-index-v2-title" data-screen-label="Підбір за моделлю — картки брендів" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B">
  <div style="max-width:1312px;margin:0 auto;padding:{{ pad }}">
    <div style="display:grid;grid-template-columns:{{ headCols }};column-gap:32px;row-gap:16px;align-items:center">
      <h2 id="brand-index-v2-title" style="grid-column:1;grid-row:1;margin:0;font-size:{{ h2Size }};line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1E232B;text-wrap:balance">Підбір за моделлю</h2>
      <a href="#" style="grid-column:{{ linkCol }};grid-row:{{ linkRow }};justify-self:start;height:48px;box-sizing:border-box;padding:0 24px;display:inline-flex;align-items:center;border:1px solid #E0001B;border-radius:8px;font-size:16px;line-height:20px;font-weight:600;color:#E0001B;text-decoration:none;white-space:nowrap;background-color:transparent;background-image:radial-gradient(circle, rgba(224,0,27,0.08) 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms cubic-bezier(0.22, 1, 0.36, 1)" style-focus="outline:2px solid #1E232B;outline-offset:2px" style-hover="background-size:300% 300%">Запитати менеджера</a>
    </div>
    <div id="brand-index-v2-grid" style="margin-top:{{ headGap }};height:{{ wrapH }};overflow:hidden;transition:height 300ms ease-out">
      <div style="display:grid;grid-template-columns:{{ gridCols }};grid-auto-rows:{{ cardH }};gap:{{ gap }}">
        <sc-for list="{{ brands }}" as="b" hint-placeholder-count="10">
          <div style="box-sizing:border-box;min-width:0;padding:16px;display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E6E9EE;border-radius:16px;visibility:{{ b.vis }};transition:visibility 300ms">
            <a href="{{ b.href }}" aria-label="{{ b.aria }}" style="flex-shrink:0;align-self:flex-start;height:48px;display:flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none" style-focus="outline:2px solid #1E232B;outline-offset:2px">
              <sc-for list="{{ b.logos }}" as="lg" hint-placeholder-count="1"><img src="{{ lg.src }}" alt="" style="display:block;flex-shrink:0;width:{{ lg.w }};height:{{ lg.h }}"></sc-for>
            </a>
            <div aria-hidden="true" style="flex-shrink:0;height:1px;margin-top:16px;background:#E6E9EE"></div>
            <div style="flex:1;min-height:0;display:flex;flex-direction:column">
              <sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="2">
                <sc-if value="{{ r.sep }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="flex-shrink:0;height:1px;background:#E6E9EE"></div></sc-if>
                <a href="{{ r.href }}" title="{{ r.name }}" aria-label="{{ r.aria }}" style="flex-shrink:0;height:{{ rowH }};margin:0 -8px;padding:0 8px;display:flex;align-items:center;gap:8px;border-radius:8px;color:#1E232B;text-decoration:none;transition:background 150ms ease-out" style-hover="background:#F3F5F7" style-focus="outline:2px solid #1E232B;outline-offset:-2px">
                  <span style="flex:1;min-width:0;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span>
                  <span style="flex-shrink:0;font-size:14px;line-height:20px;color:#4A5260">{{ r.count }}</span>
                </a>
              </sc-for>
              <sc-if value="{{ b.hasMore }}" hint-placeholder-val="{{ false }}">
                <a href="{{ b.href }}" aria-label="{{ b.moreAria }}" style="flex-shrink:0;margin-top:8px;height:{{ rowH }};box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:center;border:1px solid #E0001B;border-radius:8px;font-size:15px;line-height:20px;font-weight:600;color:#E0001B;text-decoration:none;white-space:nowrap;background-color:transparent;background-image:radial-gradient(circle, rgba(224,0,27,0.08) 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1)" style-focus="outline:2px solid #1E232B;outline-offset:2px" style-hover="background-size:300% 300%">{{ b.moreLabel }}</a>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:{{ moreGap }};display:flex;justify-content:center">
        <button type="button" aria-expanded="{{ openAttr }}" aria-controls="brand-index-v2-grid" onClick="{{ toggle }}" style="height:48px;box-sizing:border-box;padding:0 24px;display:inline-flex;align-items:center;border:1px solid #E0001B;border-radius:8px;font-family:inherit;font-size:16px;line-height:20px;font-weight:600;color:#E0001B;white-space:nowrap;cursor:pointer;background-color:transparent;background-image:radial-gradient(circle, rgba(224,0,27,0.08) 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1)" style-focus="outline:2px solid #1E232B;outline-offset:2px" style-hover="background-size:300% 300%">{{ moreLabel }}</button>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;},&quot;expanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const BRANDS = [
  ['Mitsubishi', 260, ['mitsubishi'], [['L200 2005–2015', 85], ['L200 1996–2005', 46], ['Pajero Sport I 1996–2008', 84], ['Pajero Wagon', 45]]],
  ['Ford', 226, ['ford'], [['Ranger 2006–2012', 118], ['Ranger 1998–2006', 108]]],
  ['Mazda', 226, ['mazda'], [['BT-50 2006–2012', 118], ['B2500 1998–2006', 108]]],
  ['Nissan', 172, ['nissan'], [['Navara / Pathfinder R51 2005–2015', 129], ['X-Trail T30–T31 2000–2014', 43]]],
  ['Jeep', 104, ['jeep'], [['Grand Cherokee WK 2004–2007', 81], ['Patriot / Compass 2011–2017', 23]]],
  ['Volkswagen', 103, ['volkswagen'], [['Crafter', 43], ['T5 2003–2009', 40], ['Touareg 2002–2010', 20]]],
  ['Kia', 67, ['kia'], [['Sorento 2002–2014', 67]]],
  ['Hyundai', 58, ['hyundai'], [['Santa Fe I 2004–2010', 45], ['Terracan', 13]]],
  ['Toyota', 53, ['toyota'], [['Hilux 2005–2015', 27], ['Land Cruiser Prado 90 1996–2002', 13], ['RAV4 II 2000–2005', 13]]],
  ['Mercedes-Benz', 52, ['mercedes'], [['ML W163', 52]]],
  ['SsangYong', 43, ['ssangyong'], [['Actyon 2005–2011', 28], ['Rexton 2001–2006', 15]]],
  ['Volvo', 11, ['volvo'], [['XC90 2002–2015', 11]]],
  ['BMW', 6, ['bmw'], [['X5 E53', 6]]],
  ['Peugeot / Fiat', 4, ['peugeot', 'fiat'], [['Landtrek / Titano 2020–2026', 4]]],
  ['Isuzu', 2, ['isuzu'], [['D-Max', 2]]]
];
// width / height of each colored logo (tight viewBox)
const ASPECT = { mitsubishi: 1.153, ford: 2.582, mazda: 1.244, nissan: 1.191, jeep: 2.413, volkswagen: 1, kia: 3.995, hyundai: 1.912, toyota: 1.459, mercedes: 1, ssangyong: 6.261, volvo: 1, bmw: 1, peugeot: 0.909, fiat: 0.998, isuzu: 5.318 };
const LOGO = 48;
// square marks fill the 48px box; wide wordmarks get equal optical area instead of equal height
const logoSize = a => {
  let w, h;
  if (a <= 1) { h = LOGO; w = LOGO * a; } else { w = Math.min(LOGO * a, Math.max(LOGO, Math.sqrt(LOGO * LOGO * 0.75 * a))); h = w / a; }
  return { w: Math.round(w) + 'px', h: Math.round(h) + 'px' };
};
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const LAYOUT = { desktop: [5, 10], laptop: [4, 8], tablet: [2, 6], mobile: [1, 4] };

class Component extends DCLogic {
  state = { vw: null, open: null };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }
  renderVals() {
    const s = this.state;
    const vw = s.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const [cols, initial] = LAYOUT[d];
    const m = d === 'mobile';
    const two = d !== 'mobile';
    const rowH = m ? 44 : 40;
    // border + padding + logo + divider + 3 rows + 2 separators + gap + button row
    const cardH = 2 + 32 + LOGO + 16 + 1 + 3 * rowH + 2 + 8 + rowH;
    const gap = d === 'desktop' || d === 'laptop' ? 24 : 16;
    const open = s.open ?? !!this.props.expanded;
    const hasMore = BRANDS.length > initial;
    const hOf = n => { const r = Math.ceil(n / cols); return r * cardH + (r - 1) * gap; };
    const shownN = hasMore && !open ? initial : BRANDS.length;
    return {
      pad: d === 'desktop' ? '0 64px 100px' : m ? '0 16px 75px' : '0 32px 75px',
      h2Size: d === 'desktop' ? '40px' : m ? '24px' : '28px',
      headCols: two ? 'minmax(0, 1fr) auto' : 'minmax(0, 1fr)',
      linkCol: two ? '2' : '1', linkRow: two ? '1' : '3',
      headGap: m ? '32px' : '48px',
      gridCols: `repeat(${cols}, minmax(0, 1fr))`,
      cardH: cardH + 'px',
      gap: gap + 'px',
      rowH: rowH + 'px',
      wrapH: hOf(shownN) + 'px',
      hasMore,
      moreGap: m ? '24px' : '32px',
      openAttr: open ? 'true' : 'false',
      moreLabel: open ? 'Згорнути' : `Показати всі марки (${BRANDS.length})`,
      toggle: () => this.setState({ open: !open }),
      brands: BRANDS.map(([name, count, logos, models], i) => {
        const href = 'DLSCatalog.dc.html?brand=' + encodeURIComponent(name);
        return {
          name, count: String(count), href,
          aria: `${name}: ${count} ${plural(count, 'деталь', 'деталі', 'деталей')}`,
          vis: i >= shownN ? 'hidden' : 'visible',
          logos: logos.map(f => ({ src: `assets/logos/color/${f}.svg`, ...logoSize(ASPECT[f]) })),
          rows: models.slice(0, 3).map(([mn, c], ri) => ({
            name: mn, count: String(c), sep: ri > 0,
            href: href + '&model=' + encodeURIComponent(mn),
            aria: `${name} ${mn}, деталей: ${c}`
          })),
          hasMore: models.length > 3,
          moreLabel: `Всі моделі (${models.length})`,
          moreAria: `Всі моделі ${name}: ${models.length}`
        };
      })
    };
  }
}
</script>
</body>
</html>
