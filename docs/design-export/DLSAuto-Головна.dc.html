<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>DLSAuto — б/в запчастини на пікапи та позашляховики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#12161C;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}input::placeholder{color:#6B7380;opacity:1}@keyframes dlsFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}</style>
</helmet>
<dc-import name="DLSHeaderHero" hint-size="100%,720px"></dc-import>
<dc-import name="DLSStats" hint-size="100%,300px"></dc-import>
<dc-import name="DLSBrandIndex" hint-size="100%,900px"></dc-import>
<dc-import name="DLSCategories" hint-size="100%,900px"></dc-import>
<dc-import name="DLSNewArrivals" halloween="{{ true }}" hint-size="100%,820px"></dc-import>
<dc-import name="DLSServicesWide" hint-size="100%,1400px"></dc-import>
<dc-import name="DLSPickups" hint-size="100%,820px"></dc-import>
<dc-import name="DLSSuvs" hint-size="100%,820px"></dc-import>
<dc-import name="DLSVideos" hint-size="100%,640px"></dc-import>
<dc-import name="DLSReviews" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSFaq" hint-size="100%,760px"></dc-import>
<dc-import name="DLSBenefits" hint-size="100%,360px"></dc-import>
<dc-import name="DLSFooter" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSCart" hint-size="0px,0px"></dc-import>
<dc-import name="DLSQuickView" demo-open="{{ false }}" hint-size="0px,0px"></dc-import>
{{ bats }}
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const BAT_N = 18;
const h = React.createElement;
const batSvg = (size) => h('svg', { viewBox: '0 0 100 40', width: size, height: size * 0.4, 'aria-hidden': true, style: { display: 'block', fill: '#050608', overflow: 'visible', filter: 'drop-shadow(0 0 6px rgba(245,130,32,0.85)) drop-shadow(0 0 2px rgba(255,180,90,0.9))' } },
  h('g', { style: { transformOrigin: '50px 22px', animation: 'dlsFlap 0.32s ease-in-out infinite' } },
    h('path', { d: 'M46 20C36 8 20 4 0 8c8 4 10 10 10 18 6-4 12-4 16 0 4-4 10-4 14 0 2-2 4-4 6-6z' }),
    h('path', { d: 'M54 20C64 8 80 4 100 8c-8 4-10 10-10 18-6-4-12-4-16 0-4-4-10-4-14 0-2-2-4-4-6-6z' })
  ),
  h('path', { d: 'M50 34c-4 0-6-5-6-10l-2-10 5 4h6l5-4-2 10c0 5-2 10-6 10z' })
);

class Component extends DCLogic {
  state = { done: false };
  refs_ = [];
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || this.props.bats === false) { this.setState({ done: true }); return; }
    const vw = window.innerWidth, vh = window.innerHeight, R = Math.hypot(vw, vh) * 0.75;
    let max = 0;
    this.refs_.forEach((el, i) => {
      if (!el) return;
      const ang = (i / BAT_N) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const dist = R * (0.8 + Math.random() * 0.4);
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 80;
      const mx = dx * 0.35 + (Math.random() - 0.5) * 120, my = dy * 0.35 - 40 - Math.random() * 60;
      const delay = Math.random() * 900, dur = 3800 + Math.random() * 1600;
      max = Math.max(max, delay + dur);
      const flip = dx < 0 ? -1 : 1;
      el.animate([
        { transform: `translate(-50%,-50%) translate(0,0) scale(${0.5 * flip},0.5)`, opacity: 0 },
        { transform: `translate(-50%,-50%) translate(${mx}px,${my}px) scale(${1.1 * flip},1.1) rotate(${flip * 8}deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${1.8 * flip},1.8) rotate(${flip * -6}deg)`, opacity: 1 }
      ], { duration: dur, delay, easing: 'cubic-bezier(0.4, 0, 0.6, 1)', fill: 'both' });
    });
    this.t = setTimeout(() => this.setState({ done: true }), max + 100);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    if (this.state.done) return { bats: null };
    const list = [];
    for (let i = 0; i < BAT_N; i++) {
      const size = 110 + ((i * 37) % 5) * 22;
      list.push(h('div', { key: i, ref: el => (this.refs_[i] = el), style: { position: 'absolute', left: '50%', top: '42%', opacity: 0, willChange: 'transform' } }, batSvg(size)));
    }
    return { bats: h('div', { 'aria-hidden': true, style: { position: 'fixed', inset: 0, zIndex: 9999, pointerEvents: 'none', overflow: 'hidden' } }, list) };
  }
}
</script>
</body>
</html>
