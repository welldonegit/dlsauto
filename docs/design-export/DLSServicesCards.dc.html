<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:#1E232B}a:hover{color:#4A5260}</style>
<script src="./image-slot.js"></script>
</helmet>
<section aria-labelledby="dls-svc2-h" data-screen-label="Послуги — банери" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B">
  <div style="max-width:1312px;margin:0 auto;padding:{{ pad }}">
    <h2 id="dls-svc2-h" style="margin:0;font-size:{{ h2Size }};line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1E232B;text-wrap:balance">Що ще ми робимо</h2>
    <div style="margin:{{ headGap }} {{ rowBleed }} 0;padding:0 {{ rowPadX }};display:{{ rowDisplay }};grid-template-columns:repeat(2, minmax(0, 1fr));gap:{{ gap }};overflow-x:{{ rowOverflow }};scroll-snap-type:x mandatory;scroll-padding:0 {{ rowPadX }};scrollbar-width:none">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="2">
        <article onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="position:relative;flex:none;width:{{ cardW }};aspect-ratio:{{ cardRatio }};border-radius:16px;overflow:hidden;background:#2A303A;scroll-snap-align:start">
          <div style="position:absolute;inset:0;transform:{{ c.photoTf }};transition:transform 500ms ease-out">
            <image-slot id="{{ c.id }}" shape="rect" src="{{ c.src }}" placeholder="{{ c.ph }}"></image-slot>
          </div>
          <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:50%;pointer-events:none;background:linear-gradient(0deg, rgba(18,22,28,0.85) 0%, rgba(18,22,28,0) 100%)"></div>
          <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:65%;pointer-events:none;background:linear-gradient(0deg, rgba(18,22,28,0.95) 0%, rgba(18,22,28,0.7) 45%, rgba(18,22,28,0) 100%);opacity:{{ c.gradOp }};transition:opacity 300ms ease-out"></div>
          <div style="position:absolute;left:{{ inset }};right:{{ textRight }};bottom:{{ inset }};display:flex;flex-direction:column;pointer-events:none">
            <h3 style="margin:0;font-size:{{ h3Size }};line-height:1.2;font-weight:600;letter-spacing:-0.01em;color:#FCFCFD;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ c.title }}</h3>
            <div style="display:grid;grid-template-rows:{{ c.descRows }};transition:grid-template-rows 300ms ease-out">
              <div style="min-height:0;overflow:hidden">
                <p style="margin:0;padding-top:12px;font-size:16px;line-height:1.5;color:rgba(252,252,253,0.85);text-wrap:pretty;opacity:{{ c.descOp }};transform:{{ c.descTf }};transition:opacity 300ms ease-out, transform 300ms ease-out">{{ c.text }}</p>
              </div>
            </div>
          </div>
          <a href="#" aria-label="{{ c.title }}" style="position:absolute;right:{{ inset }};bottom:{{ inset }};width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ c.btnBg }};color:{{ c.btnFg }};transition:background 300ms ease-out, color 300ms ease-out">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ c.arrowTf }};transition:transform 300ms ease-out"><path d="M5 12H19M13 6L19 12L13 18"></path></svg>
          </a>
        </article>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:820},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;}}">
const CARDS = [
  ['svc-sto', './assets/service-sto.jpg', 'Пікап на підйомнику в боксі', 'Ремонт у власному сервісі', 'Діагностика, ходова, двигуни та агрегати. Ставимо деталі з нашої розборки'],
  ['svc-razborka', './assets/service-razborka.jpg', 'Биті авто в цеху', 'Викуповуємо авто на розбірку', 'Биті, після ДТП, з несправним двигуном — оцінимо за фото за годину, заберемо самі по Запоріжжю та області']
];

class Component extends DCLogic {
  state = { vw: null, hover: -1 };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const RH = this.props.rhythm ? ((this.props.device ? /desktop|laptop/.test(this.props.device) : vw >= 1024) ? 96 : 64) : 0; const RG = RH === 96 ? 32 : 24;
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const wide = d === 'desktop' || d === 'laptop';
    const m = d === 'mobile';
    const side = d === 'desktop' ? 64 : m ? 16 : 32;
    return {
      pad: ((this.props.topPad && RH) ? RH : 0) + 'px ' + (d === 'desktop' ? ('64px ' + (RH || 100) + 'px') : m ? ('16px ' + (RH || 75) + 'px') : ('32px ' + (RH || 75) + 'px')),
      h2Size: wide ? '40px' : d === 'tablet' ? '28px' : '24px',
      h3Size: d === 'desktop' ? '28px' : m ? '20px' : '24px',
      headGap: RH ? RG + 'px' : (m ? '32px' : '48px'),
      gap: m ? '16px' : '24px',
      inset: m ? '16px' : '24px',
      textRight: m ? '80px' : '96px',
      rowDisplay: wide ? 'grid' : 'flex',
      rowOverflow: wide ? 'visible' : 'auto',
      rowBleed: wide ? '0' : '-' + side + 'px',
      rowPadX: wide ? '0' : side + 'px',
      cardW: wide ? 'auto' : d === 'tablet' ? '44%' : '80%',
      cardRatio: wide ? '4 / 3' : '3 / 4',
      cards: CARDS.map(([id, src, ph, title, text], i) => {
        const on = !wide || this.state.hover === i;
        const hv = wide && this.state.hover === i;
        return {
          id: id + '-b', src, ph, title, text, n: '0' + (i + 1),
          enter: () => this.setState({ hover: i }),
          leave: () => this.setState(s => (s.hover === i ? { hover: -1 } : null)),
          photoTf: hv ? 'scale(1.04)' : 'scale(1)',
          gradOp: on ? 1 : 0,
          descRows: on ? '1fr' : '0fr',
          descOp: on ? 1 : 0,
          descTf: on ? 'translateY(0)' : 'translateY(8px)',
          btnBg: hv ? '#E0001B' : '#FCFCFD',
          btnFg: hv ? '#FCFCFD' : '#1E232B',
          arrowTf: hv ? 'rotate(-45deg)' : 'rotate(0deg)'
        };
      })
    };
  }
}
</script>
</body>
</html>
