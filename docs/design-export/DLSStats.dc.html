<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<section ref="{{ rootRef }}" aria-label="DLSAuto у цифрах" data-screen-label="Цифри" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B">
  <dl style="box-sizing:border-box;max-width:{{ boxMax }};margin:0 auto;padding:{{ pad }};display:grid;grid-template-columns:{{ cols }};justify-content:{{ justify }};gap:{{ rowGap }} 24px">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
      <div style="min-width:0;display:flex;flex-direction:column">
        <dt style="order:2;margin:{{ capGap }} 0 0;font-size:{{ capSize }};line-height:1.4;color:#4A5260">{{ s.label }}</dt>
        <dd aria-label="{{ s.final }}" style="order:1;margin:0;font-size:{{ numSize }};line-height:1;font-weight:400;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:#1E232B;white-space:nowrap">{{ s.shown }}</dd>
      </div>
    </sc-for>
  </dl>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:360},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'tablet'|'mobile'&quot;}}">
const STATS = [
  [5000, '+', 'замовлень на рік'],
  [60, '', 'днів гарантії', 'до '],
  [1200, '+', 'деталей у наявності'],
  [4, '+', 'роки на ринку']
];
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
const DURATION = 1200;

class Component extends DCLogic {
  state = { vw: null, t: 0 };
  rootRef = React.createRef();

  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) { this.setState({ t: 1 }); return; }
    this.io = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) { this.io.disconnect(); this.start(); }
    }, { threshold: 0.4 });
    if (this.rootRef.current) this.io.observe(this.rootRef.current);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    if (this.io) this.io.disconnect();
    cancelAnimationFrame(this.raf);
  }
  start() {
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / DURATION);
      this.setState({ t: 1 - Math.pow(1 - p, 3) });
      if (p < 1) this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const device = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 768 ? 'tablet' : 'mobile');
    const t = this.state.t;
    return {
      rootRef: this.rootRef,
      pad: device === 'desktop' ? '100px 64px' : device === 'tablet' ? '75px 32px' : '75px 16px',
      cols: device === 'desktop' ? 'repeat(4, max-content)' : 'repeat(2, minmax(0, 1fr))',
      justify: device === 'desktop' ? 'space-between' : 'stretch',
      boxMax: device === 'desktop' ? 'calc(1312px + 128px)' : device === 'tablet' ? 'calc(1312px + 64px)' : 'calc(1312px + 32px)',
      rowGap: device === 'mobile' ? '32px' : '48px',
      numSize: device === 'desktop' ? '76px' : device === 'tablet' ? '64px' : '40px',
      capSize: device === 'mobile' ? '16px' : '18px',
      capGap: device === 'mobile' ? '8px' : '16px',
      stats: STATS.map(([v, suf, label, pre = '']) => ({
        label,
        final: pre + fmt(v) + suf,
        shown: pre + fmt(Math.round(v * t)) + suf
      }))
    };
  }
}
</script>
</body>
</html>
