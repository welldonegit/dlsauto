<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Про компанію — DLSAuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#12161C;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}input::placeholder{color:#6B7380;opacity:1}</style>
</helmet>
<dc-import name="DLSHeaderHero" hero="{{ false }}" hint-size="100%,168px"></dc-import>
<section ref="{{ heroRef }}" aria-labelledby="about3-h1" data-screen-label="Про компанію — перший екран" style="position:relative;overflow:hidden;isolation:isolate;min-height:{{ minH }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#12161C;font-family:'Golos Text',sans-serif;color:#FCFCFD">
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;pointer-events:none">
    <div style="position:absolute;top:-35%;right:-15%;width:75%;height:110%;border-radius:50%;background:radial-gradient(closest-side, rgba(224,0,27,0.3), rgba(224,0,27,0.12) 55%, rgba(224,0,27,0) 100%);filter:blur(64px)"></div>
    <div style="position:absolute;top:-40%;left:48%;width:22%;height:150%;transform:rotate(38deg);transform-origin:50% 0;background:linear-gradient(180deg, rgba(224,0,27,0.28) 0%, rgba(224,0,27,0.14) 40%, rgba(224,0,27,0) 75%);filter:blur(56px)"></div>
    <div style="position:absolute;left:50%;bottom:0;width:{{ discW }};aspect-ratio:1 / 1;transform:translate(-50%, 40%) perspective(1800px) rotateX(64deg) rotateY(-10deg);opacity:0.7">
      <svg viewBox="-500 -500 1000 1000" style="display:block;width:100%;height:100%;overflow:visible">
        <defs>
          <filter id="about3-glow" x="-30%" y="-30%" width="160%" height="160%"><feMorphology operator="dilate" radius="3"></feMorphology><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
          <g id="about3-disc" fill="none" stroke="#E0001B" stroke-linecap="round">
            <circle r="480" stroke-width="3" vector-effect="non-scaling-stroke"></circle>
            <circle r="440" stroke-width="1" vector-effect="non-scaling-stroke"></circle>
            <circle r="400" stroke-width="1" vector-effect="non-scaling-stroke"></circle>
            <circle r="360" stroke-width="1" vector-effect="non-scaling-stroke"></circle>
            <circle r="320" stroke-width="1" vector-effect="non-scaling-stroke"></circle>
            <circle r="210" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
            <circle r="72" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
            <circle cx="0" cy="-138" r="20" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
            <circle cx="131.2" cy="-42.6" r="20" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
            <circle cx="81.1" cy="111.6" r="20" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
            <circle cx="-81.1" cy="111.6" r="20" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
            <circle cx="-131.2" cy="-42.6" r="20" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
          </g>
        </defs>
        <g ref="{{ discRef }}">
          <use ref="{{ glowRef }}" href="#about3-disc" filter="url(#about3-glow)"></use>
          <use href="#about3-disc"></use>
        </g>
      </svg>
    </div>
  </div>
  <div style="box-sizing:border-box;width:100%;max-width:1312px;padding:{{ pad }};display:flex;flex-direction:column;align-items:center;text-align:center">
    <h1 id="about3-h1" style="margin:0;font-size:{{ h1Size }};line-height:1.05;font-weight:400;letter-spacing:-0.035em;color:#FCFCFD;text-wrap:balance">
      <span style="display:block">Самі купуємо авто. Самі розбираємо.</span>
      <span style="display:block;padding-bottom:0.08em;background:linear-gradient(90deg, #FCFCFD 0%, #E6E9EE 45%, #A9B0BB 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">Самі відповідаємо.</span>
    </h1>
    <p style="margin:{{ textGap }} 0 0;max-width:640px;font-size:{{ textSize }};line-height:1.5;color:rgba(252,252,253,0.75);text-wrap:pretty">DLSAuto — авторозбірка в Дніпрі. Купуємо авто після ДТП, розбираємо самі, перевіряємо кожну деталь і фотографуємо з усіма дефектами. Понад 5000 замовлень на рік по всій Україні.</p>
    <button type="button" onClick="{{ scrollNext }}" style="margin-top:{{ btnGap }};height:56px;padding:0 24px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;background:#FCFCFD;color:#1E232B;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:background 150ms ease-out" style-hover="background:#E6E9EE">
      Наша історія
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5V19M6 13L12 19L18 13"></path></svg>
    </button>
  </div>
</section>
<div ref="{{ nextRef }}">
  <dc-import name="DLSStatsNotch" hint-size="100%,860px"></dc-import>
</div>
<dc-import name="DLSFooter" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSCart" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;}}">
class Component extends DCLogic {
  state = { vw: null };
  heroRef = React.createRef();
  nextRef = React.createRef();
  discRef = React.createRef();
  glowRef = React.createRef();

  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t0 = performance.now();
    const tick = (now) => {
      const t = (now - t0) / 1000;
      if (this.discRef.current) this.discRef.current.setAttribute('transform', 'rotate(' + ((t / 40) * 360 % 360).toFixed(3) + ')');
      if (this.glowRef.current) this.glowRef.current.style.opacity = (0.75 + 0.25 * Math.sin((t / 4) * Math.PI * 2)).toFixed(3);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const wide = d === 'desktop' || d === 'laptop';
    const m = d === 'mobile';
    return {
      heroRef: this.heroRef, nextRef: this.nextRef, discRef: this.discRef, glowRef: this.glowRef,
      scrollNext: () => {
        const el = this.nextRef.current;
        if (!el) return;
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: reduce ? 'auto' : 'smooth' });
      },
      minH: wide ? '85vh' : '0px',
      pad: d === 'desktop' ? '96px 64px 192px' : d === 'laptop' ? '96px 32px 192px' : d === 'tablet' ? '64px 32px 160px' : '48px 16px 128px',
      h1Size: d === 'desktop' ? '72px' : d === 'laptop' ? '56px' : d === 'tablet' ? '40px' : '32px',
      textGap: m ? '24px' : '32px',
      textSize: d === 'desktop' ? '18px' : m ? '14px' : '16px',
      btnGap: m ? '32px' : '48px',
      discW: '60%'
    };
  }
}
</script>
</body>
</html>
