<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}@keyframes dlsSwipe{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}</style>
</helmet>
<section aria-labelledby="pickups-title" data-screen-label="Пікапи" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B;padding-bottom:{{ sectionPad }}">
  <div style="padding-left:{{ side }};display:grid;grid-template-columns:{{ gridCols }};gap:24px;align-items:stretch">
    <aside style="position:relative;min-width:0;align-self:start;aspect-ratio:9 / 16;margin-right:{{ asideRight }};overflow:hidden;border-radius:16px;background:#2A303A;color:#FCFCFD">
      <video ref="{{ videoRef }}" src="{{ videoSrc }}" aria-label="Пікап на бездоріжжі" muted="{{ true }}" loop="{{ true }}" autoPlay="{{ true }}" playsInline="{{ true }}" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></video>
      <sc-if value="{{ showFilter }}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(18,22,28,0.6)"></div>
        <div style="position:relative;height:100%;box-sizing:border-box;padding:{{ asidePad }};display:flex;flex-direction:column;justify-content:flex-end">
        <span style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#CDD2DA">Пікапи</span>
        <h2 id="pickups-title" style="margin:8px 0 0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#FCFCFD;text-wrap:balance">Оберіть свій пікап</h2>
        <p style="margin:8px 0 0;font-size:16px;line-height:1.5;color:rgba(252,252,253,0.8);text-wrap:pretty">Покажемо, що найчастіше купують саме на вашу модель</p>
        <div role="group" aria-label="Модель пікапа" style="margin-top:24px;display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ chips }}" as="ch" hint-placeholder-count="7">
            <button onClick="{{ ch.select }}" aria-pressed="{{ ch.active }}" style="position:relative;min-height:44px;box-sizing:border-box;padding:8px 40px;display:flex;align-items:center;justify-content:center;border:1px solid {{ ch.border }};border-radius:8px;background:{{ ch.bg }};color:{{ ch.color }};font-family:inherit;font-size:15px;line-height:20px;text-align:center;cursor:pointer;transition:border-color 200ms cubic-bezier(0.22, 1, 0.36, 1), background 200ms cubic-bezier(0.22, 1, 0.36, 1), color 200ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="border-color:#FCFCFD" style-focus="outline:2px solid #FCFCFD;outline-offset:2px">
              <span style="text-wrap:balance">{{ ch.label }}</span>
              <span style="position:absolute;top:50%;right:12px;transform:translateY(-50%);font-size:12px;line-height:16px;color:{{ ch.countColor }}">{{ ch.count }}</span>
            </button>
          </sc-for>
        </div>
        <p style="margin:16px 0 0;font-size:13px;line-height:1.4;color:rgba(252,252,253,0.7);text-wrap:pretty">Якщо авто вже обрано в шапці — модель підставляється автоматично</p>
      </div>
      </sc-if>
      <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(18,22,28,0.2)"></div>
        <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(18,22,28,0.72) 0%, rgba(18,22,28,0.32) 55%, rgba(18,22,28,0) 80%)"></div>
        <div style="position:relative;height:100%;min-height:{{ bannerMin }};box-sizing:border-box;padding:24px;display:flex;flex-direction:column;align-items:flex-start">
          <h2 id="pickups-title" style="margin:0;font-size:{{ bannerH2 }};line-height:1.1;font-weight:600;letter-spacing:-0.02em;color:#FCFCFD;text-wrap:balance">Запчастини на пікапи</h2>
          <p style="margin:12px 0 0;font-size:16px;line-height:1.5;color:#FCFCFD;text-wrap:pretty">Б/в оригінальні деталі на L200, Ranger та Navara</p>
          <a href="#" style="margin-top:24px;height:48px;box-sizing:border-box;padding:0 24px;display:flex;align-items:center;border-radius:8px;background-color:#E0001B;background-image:radial-gradient(circle, #B80016 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;font-size:16px;font-weight:600;color:#FCFCFD;text-decoration:none;white-space:nowrap;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="background-size:300% 300%;color:#FCFCFD" style-focus="outline:2px solid #FCFCFD;outline-offset:2px">Усі пікапи</a>
        </div>
      </sc-if>
    </aside>
    <div style="min-width:0;display:flex;flex-direction:column">
      <div style="padding-right:{{ side }};display:flex;flex-direction:column;gap:16px">
        <sc-if value="{{ showSwipe }}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:#4A5260">{{ swipeHand }}<span>Гортайте</span></div>
        </sc-if>
        <div ref="{{ chipsRef }}" onScroll="{{ onChipsScroll }}" role="tablist" aria-label="Модель пікапа" style="min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth">
          <sc-for list="{{ chips }}" as="tb" hint-placeholder-count="7">
            <button role="tab" aria-selected="{{ tb.active }}" onClick="{{ tb.select }}" style="height:40px;flex-shrink:0;box-sizing:border-box;padding:0 16px 0 12px;display:flex;align-items:center;gap:8px;border:1px solid {{ tb.tabBorder }};border-radius:8px;background:{{ tb.tabBg }};color:{{ tb.tabColor }};font-family:inherit;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background 200ms cubic-bezier(0.22, 1, 0.36, 1), border-color 200ms cubic-bezier(0.22, 1, 0.36, 1), color 200ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="border-color:#1E232B" style-focus="outline:2px solid #1E232B;outline-offset:2px"><span style="display:flex;align-items:center;gap:6px"><sc-if value="{{ tb.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ tb.logoSrc }}" alt="" style="width:16px;height:16px;flex-shrink:0;object-fit:contain;display:block;filter:{{ tb.logoFilter }};transition:filter 200ms cubic-bezier(0.22, 1, 0.36, 1)"></sc-if>{{ tb.label }}</span><span style="font-size:12px;line-height:16px;font-weight:400;color:{{ tb.tabCount }}">{{ tb.count }}</span></button>
          </sc-for>
        </div>
      </div>
      <div ref="{{ scrollRef }}" onScroll="{{ onScroll }}" style="flex:1;margin:0 0 {{ scrollMb }} -16px;padding:24px {{ side }} 168px 16px;scroll-padding-left:16px;display:flex;align-items:stretch;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;opacity:{{ fadeOp }};transition:opacity 200ms ease-out">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
          <div style="position:relative;z-index:{{ c.z }};flex:0 0 224px;width:224px;min-width:0;display:flex;scroll-snap-align:start" style-hover="z-index:3">
            <dc-import name="DLSProductCard" style="width:100%;height:100%" photo-src="assets/part-pickup-hub.jpg" donor="{{ c.donor }}" model="{{ c.model }}" brand="{{ c.brand }}" part-name="{{ c.name }}" oem="{{ c.oem }}" price="{{ c.price }}" old-price="{{ c.oldPrice }}" popular="{{ c.popular }}" fits="{{ c.fits }}" favorite="{{ c.favorite }}" specs="{{ c.specs }}" photos="{{ c.photos }}" demo-hover="{{ c.demo }}" hint-size="224px,520px"></dc-import>
          </div>
        </sc-for>
      </div>
      <div style="position:relative;z-index:2;padding-right:{{ side }};display:flex;justify-content:flex-end">
        <sc-if value="{{ showArrows }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;gap:8px">
              <button aria-label="Попередні" onClick="{{ scrollPrev }}" disabled="{{ atStart }}" style="width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #CDD2DA;border-radius:50%;background:#FCFCFD;color:{{ prevColor }};cursor:{{ prevCursor }};transition:border-color 150ms ease-out" style-hover="border-color:#1E232B"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m15 18-6-6 6-6"></path></svg></button>
              <button aria-label="Наступні" onClick="{{ scrollNext }}" disabled="{{ atEnd }}" style="width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #CDD2DA;border-radius:50%;background:#FCFCFD;color:{{ nextColor }};cursor:{{ nextCursor }};transition:border-color 150ms ease-out" style-hover="border-color:#1E232B"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m9 18 6-6-6-6"></path></svg></button>
            </div>
          </sc-if>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;model&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;L200 2005–2015&quot;,&quot;Ranger / BT-50 2006–2012&quot;,&quot;Navara / Pathfinder R51&quot;,&quot;L200 1996–2005&quot;,&quot;Hilux 2005–2015&quot;,&quot;Ranger / B2500 1998–2006&quot;,&quot;D-Max&quot;],&quot;default&quot;:&quot;L200 2005–2015&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showFilter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'tablet'|'mobile'&quot;}}">
const MODELS = [
  ['L200 2005–2015', 85, 'L200', 'Mitsubishi L200 2005–2015', [
    ['Амортизатор задній', 'MN184022', 14, 'Перевірено', '1 400 ₴', true],
    ['Фара права', '8301A396', 14, 'Перевірено', '4 200 ₴', true],
    ['Роздатка Super Select', 'MR580741', 30, 'Перевірено на стенді', '18 500 ₴', false],
    ['Борт задній відкидний', '5801A082', 14, 'Перевірено', '5 600 ₴', false],
    ['Ресора задня в зборі', '4110A060', 14, 'Перевірено', '3 100 ₴', false]
  ]],
  ['Ranger / BT-50 2006–2012', 118, 'Ranger / BT-50', 'Ford Ranger / Mazda BT-50 2006–2012', [
    ['Фара ліва галоген', 'UR56-51-040', 14, 'Перевірено', '4 500 ₴', true],
    ['Бампер передній', 'UR58-50-031', 14, 'Перевірено', '5 900 ₴', false],
    ['Радіатор охолодження 2.5 TD', 'WL81-15-200', 14, 'Перевірено', '3 400 ₴', true],
    ['Турбіна RHF5', 'WE01-13-700', 30, 'Перевірено на стенді', '9 800 ₴', false],
    ['Дзеркало ліве електричне', 'UR56-69-180', 14, 'Перевірено', '2 300 ₴', false]
  ]],
  ['Navara / Pathfinder R51', 129, 'Navara / Pathfinder', 'Nissan Navara / Pathfinder R51 2005–2015', [
    ['Двигун 2.5 dCi YD25', '10102-EB3A0', 30, 'Перевірено на стенді', '85 000 ₴', true],
    ['Фара ліва', '26060-EB300', 14, 'Перевірено', '3 900 ₴', false],
    ['Кардан задній', '37000-EB300', 14, 'Перевірено', '4 800 ₴', true],
    ['Генератор', '23100-EB300', 30, 'Перевірено на стенді', '3 600 ₴', false],
    ['Борт задній', '93400-EB330', 14, 'Перевірено', '5 200 ₴', false]
  ]],
  ['L200 1996–2005', 46, 'L200 1996–2005', 'Mitsubishi L200 1996–2005', [
    ['Фара права', 'MR296446', 14, 'Перевірено', '2 600 ₴', true],
    ['Роздатка', 'MR477570', 30, 'Перевірено на стенді', '14 500 ₴', false],
    ['Радіатор охолодження', 'MR281283', 14, 'Перевірено', '2 400 ₴', false],
    ['Двері передні ліві', 'MR389659', 14, 'Перевірено', '4 900 ₴', true],
    ['Ресора задня', 'MB906221', 14, 'Перевірено', '2 700 ₴', false]
  ]],
  ['Hilux 2005–2015', 27, 'Hilux', 'Toyota Hilux 2005–2015', [
    ['Фара ліва', '81170-0K010', 14, 'Перевірено', '4 800 ₴', true],
    ['Бампер передній', '52119-0K908', 14, 'Перевірено', '6 200 ₴', false],
    ['Турбіна 2KD-FTV', '17201-30070', 30, 'Перевірено на стенді', '11 500 ₴', true],
    ['Рульова рейка', '44200-0K040', 30, 'Перевірено на стенді', '7 900 ₴', false],
    ['Дзеркало праве', '87910-0K130', 14, 'Перевірено', '2 600 ₴', false]
  ]],
  ['Ranger / B2500 1998–2006', 108, 'Ranger / B2500', 'Ford Ranger / Mazda B2500 1998–2006', [
    ['Фара ліва', 'UH71-51-040', 14, 'Перевірено', '2 200 ₴', true],
    ['КПП механічна', 'UH75-17-150', 30, 'Перевірено на стенді', '12 800 ₴', false],
    ['Радіатор охолодження', 'WL51-15-200', 14, 'Перевірено', '2 300 ₴', false],
    ['Капот', 'UH73-52-31X', 14, 'Перевірено', '3 900 ₴', true],
    ['Двері задні праві', 'UH75-72-020', 14, 'Перевірено', '3 500 ₴', false]
  ]],
  ['D-Max', 2, 'D-Max', 'Isuzu D-Max', [
    ['Фара права', '8-98005-428-0', 14, 'Перевірено', '3 700 ₴', true],
    ['Бампер задній', '8-98012-345-0', 14, 'Перевірено', '4 400 ₴', false]
  ]]
];
const LOGOS = ['mitsubishi', 'ford', 'nissan', 'mitsubishi', 'toyota', 'ford', 'isuzu'];
const STEP = 224 + 24;
const PHOTOS = 6;
const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const tr = (props, ms, delay = 0) => props.map(p => `${p} ${ms}ms ${EASE} ${delay}ms`).join(', ');
const indexOf = (label) => Math.max(0, MODELS.findIndex(m => m[0] === label));

class Component extends DCLogic {
  state = { vw: null, model: null, fading: false, hovered: null, photo: {}, atStart: true, atEnd: false };
  scrollRef = React.createRef();
  chipsRef = React.createRef();
  swipeHand = React.createElement('svg', { viewBox: '0 0 24 24', width: 20, height: 20, 'aria-hidden': true, style: { flexShrink: 0, fill: 'none', stroke: '#1E232B', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', animation: 'dlsSwipe 1.6s ease-in-out infinite' } },
    React.createElement('path', { d: 'M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2' }),
    React.createElement('path', { d: 'M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2' }),
    React.createElement('path', { d: 'M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8' }),
    React.createElement('path', { d: 'M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15' }));
  syncChips() {
    const el = this.chipsRef.current;
    if (!el) return;
    const over = el.scrollWidth > el.clientWidth + 2;
    if (over !== this.state.chipsOver) this.setState({ chipsOver: over });
  }
  videoRef = (el) => {
    this.video = el;
    if (el) { el.muted = true; el.defaultMuted = true; el.loop = true; el.playsInline = true; el.setAttribute('playsinline', ''); el.setAttribute('muted', ''); }
  };

  componentDidMount() {
    this.onResize = () => { this.setState({ vw: window.innerWidth }); this.syncEdges(); this.syncChips(); };
    window.addEventListener('resize', this.onResize);
    this.syncEdges();
    this.syncChips();
    this.chipsTimer = setTimeout(() => this.syncChips(), 600);
    fetch('assets/videos/pickup.mp4').then(r => r.ok ? r.blob() : null).then(b => {
      if (!b || this.unmounted) return;
      this.blobUrl = URL.createObjectURL(b);
      this.setState({ videoSrc: this.blobUrl }, () => this.playVideo());
    }).catch(() => {});
  }
  playVideo() {
    const v = this.video;
    if (!v || !this.state.videoSrc) return;
    v.muted = true;
    const go = () => v.play().catch(() => {});
    if (v.readyState >= 2) go(); else v.addEventListener('loadeddata', go, { once: true });
  }
  componentDidUpdate() { if (this.video && this.video.paused && this.state.videoSrc && !this.unmounted) this.playVideo(); }
  componentWillUnmount() {
    this.unmounted = true;
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this.fadeTimer);
    clearTimeout(this.chipsTimer);
    if (this.blobUrl) URL.revokeObjectURL(this.blobUrl);
  }

  syncEdges() {
    const el = this.scrollRef.current;
    if (!el) return;
    const atStart = el.scrollLeft <= 2, atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
    if (atStart !== this.state.atStart || atEnd !== this.state.atEnd) this.setState({ atStart, atEnd });
  }

  current() { return this.state.model ?? indexOf(this.props.model ?? 'L200 2005–2015'); }

  select(i) {
    if (i === this.current() && !this.state.fading) return;
    clearTimeout(this.fadeTimer);
    this.setState({ fading: true });
    this.fadeTimer = setTimeout(() => {
      this.setState({ model: i, hovered: null, photo: {}, fading: false }, () => {
        const el = this.scrollRef.current;
        if (el) el.scrollLeft = 0;
        this.syncEdges();
      });
    }, 200);
  }

  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const device = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 768 ? 'tablet' : 'mobile');
    const m = device === 'mobile';
    const pad = device === 'desktop' ? 64 : device === 'tablet' ? 32 : 16;
    const sectionPad = device === 'desktop' ? 100 : 75;
    const side = `max(${pad}px, calc((100% - 1312px) / 2))`;
    const cur = this.current();
    const [chipLabel, count, short, donor, items] = MODELS[cur];
    const s = this.state;

    const chips = MODELS.map(([label, n], i) => {
      const a = i === cur;
      return {
        label, count: n, active: a,
        bg: a ? '#FCFCFD' : 'transparent',
        color: a ? '#1E232B' : '#FCFCFD',
        border: a ? '#FCFCFD' : 'rgba(252,252,253,0.4)',
        countColor: a ? '#4A5260' : 'rgba(252,252,253,0.7)',
        tabBg: a ? '#1E232B' : '#FCFCFD',
        tabColor: a ? '#FCFCFD' : '#1E232B',
        tabBorder: a ? '#1E232B' : '#E6E9EE',
        tabCount: a ? '#CDD2DA' : '#6B7380',
        logoSrc: `assets/logos/${LOGOS[i]}.svg`,
        hasLogo: true,
        logoFilter: a ? 'brightness(0) invert(1)' : 'none',
        select: () => this.select(i)
      };
    });

    const SHORT = ['L200 2005–2015', 'Ranger 2006–2012', 'Navara 2005–2015', 'L200 1996–2005', 'Hilux 2005–2015', 'Ranger 1998–2006', 'D-Max'];
    const BRANDS = ['mitsubishi', 'ford', 'nissan', 'mitsubishi', 'toyota', 'ford', 'isuzu'];
    const cards = items.map(([name, oem, days, check, price, popular], i) => ({
      donor, name, oem, price, popular, oldPrice: null, photos: PHOTOS,
      model: SHORT[cur], brand: BRANDS[cur],
      fits: false, favorite: false, demo: false, z: 1,
      specs: [['Стан', 'Б/в, оригінал'], ['Гарантія', `${days} днів`], ['Перевірка', check], ['Сумісність', short]],
      key: cur + '-' + i
    }));

    return {
      sectionPad: `${sectionPad}px`,
      chipsRef: this.chipsRef,
      onChipsScroll: () => {},
      showSwipe: !!s.chipsOver,
      swipeHand: this.swipeHand,
      scrollMb: m ? '-168px' : '-144px',
      side,
      gridCols: m ? 'minmax(0, 1fr)' : device === 'desktop' ? '328px minmax(0, 1fr)' : '272px minmax(0, 1fr)',
      asideRight: m ? side : '0px',
      asidePad: m ? '24px 16px' : '56px 16px 16px',
      headDir: m ? 'column' : 'row',
      headAlign: m ? 'flex-start' : 'center',
      title: `Найчастіше купують на ${chipLabel}`,
      linkText: `Усі деталі на ${short} (${count}) →`,
      fadeOp: s.fading ? 0 : 1,
      showFilter: !!this.props.showFilter,
      showBanner: !this.props.showFilter,
      videoRef: this.videoRef,
      videoSrc: s.videoSrc,
      bannerMin: '0px',
      bannerH2: device === 'desktop' ? '32px' : device === 'tablet' ? '26px' : '32px',
      chips,
      showArrows: !m,
      atStart: s.atStart, atEnd: s.atEnd,
      prevColor: s.atStart ? '#A9B0BB' : '#1E232B', prevCursor: s.atStart ? 'default' : 'pointer',
      nextColor: s.atEnd ? '#A9B0BB' : '#1E232B', nextCursor: s.atEnd ? 'default' : 'pointer',
      scrollPrev: () => this.scrollRef.current?.scrollBy({ left: -STEP, behavior: 'smooth' }),
      scrollNext: () => this.scrollRef.current?.scrollBy({ left: STEP, behavior: 'smooth' }),
      scrollRef: this.scrollRef,
      onScroll: () => this.syncEdges(),
      cards
    };
  }
}
</script>
</body>
