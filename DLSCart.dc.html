<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
<script src="./dls-cart.js"></script>
</helmet>
<div data-screen-label="Кошик" style="position:{{ rootPos }};inset:0;z-index:1100;pointer-events:{{ rootEvents }};visibility:{{ rootVis }};font-family:'Golos Text',sans-serif;color:#1E232B">
  <div onClick="{{ close }}" aria-hidden="true" style="position:absolute;inset:0;background:rgba(18,22,28,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:{{ overlayOp }};transition:opacity 300ms ease-out"></div>
  <aside role="dialog" aria-modal="true" aria-labelledby="cart-title" style="position:absolute;top:0;right:0;bottom:0;width:480px;max-width:100%;display:flex;flex-direction:column;background:#FFFFFF;transform:{{ panelT }};transition:transform 300ms ease-out">
    <div style="padding:{{ headPad }};display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #E6E9EE">
      <h2 id="cart-title" style="margin:0;font-size:{{ h2Size }};line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1E232B">Кошик</h2>
      <button onClick="{{ close }}" aria-label="Закрити кошик" style="width:48px;height:48px;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #E6E9EE;border-radius:8px;background:#FFFFFF;color:#1E232B;cursor:pointer;transition:border-color 150ms ease-out" style-hover="border-color:#1E232B" style-focus="outline:2px solid #1E232B;outline-offset:2px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
        <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true" style="fill:none;stroke:#6B7380;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
        <p style="margin:0;font-size:16px;line-height:1.5;color:#1E232B">У кошику поки порожньо</p>
        <a href="#" onClick="{{ close }}" style="margin-top:8px;height:48px;box-sizing:border-box;padding:0 24px;display:flex;align-items:center;border:1px solid #E0001B;border-radius:8px;font-size:16px;font-weight:600;color:#E0001B;text-decoration:none;white-space:nowrap;background-color:transparent;background-image:radial-gradient(circle, rgba(224,0,27,0.08) 0 49%, rgba(0,0,0,0) 50%);background-position:center;background-repeat:no-repeat;background-size:0% 0%;transition:background-size 480ms cubic-bezier(0.22, 1, 0.36, 1), color 280ms cubic-bezier(0.22, 1, 0.36, 1)" style-hover="background-size:300% 300%">До каталогу</a>
      </div>
    </sc-if>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;min-height:0;overflow-y:auto;padding:{{ listPad }}">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="1">
          <div style="padding:24px 0;display:flex;gap:16px;border-bottom:1px solid #E6E9EE">
            <div style="width:96px;height:96px;flex-shrink:0;overflow:hidden;border-radius:8px;background:#F3F5F7"><img src="{{ it.photo }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column">
              <p style="margin:0;font-size:18px;line-height:24px;font-weight:600;color:#1E232B;text-wrap:pretty">{{ it.name }}</p>
              <p style="margin:4px 0 0;font-size:14px;line-height:20px;color:#4A5260">{{ it.donor }}</p>
              <p style="margin:0;font-size:14px;line-height:20px;color:#4A5260">OEM {{ it.oem }}</p>
              <p style="margin:4px 0 0;font-size:13px;line-height:18px;color:#4A5260">1 шт, в одному екземплярі</p>
              <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:16px">
                <span style="font-size:18px;line-height:24px;font-weight:600;color:#1E232B;white-space:nowrap">{{ it.priceText }}</span>
                <button onClick="{{ it.remove }}" style="padding:0;display:flex;align-items:center;gap:4px;border:none;background:none;font:inherit;font-size:14px;line-height:20px;color:#4A5260;cursor:pointer" style-hover="color:#1E232B">Видалити<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="flex-shrink:0;padding:{{ footPad }};display:flex;flex-direction:column;gap:16px;border-top:1px solid #E6E9EE">
        <sc-if value="{{ belowMin }}" hint-placeholder-val="{{ true }}">
          <div role="alert" style="padding:16px;display:flex;align-items:flex-start;gap:12px;border:1px solid #E0001B;border-radius:8px;background:#FDEDEF">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex-shrink:0;margin-top:2px;fill:none;stroke:#E0001B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
            <p style="margin:0;font-size:15px;line-height:1.5;color:#1E232B;text-wrap:pretty">Мінімальне замовлення — <span style="font-weight:600;color:#E0001B">500 ₴</span>. Додайте ще <span style="font-weight:600;color:#E0001B">{{ leftText }}</span></p>
          </div>
        </sc-if>
        <sc-if value="{{ belowMin }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="height:6px;overflow:hidden;border-radius:999px;background:#E6E9EE"><div style="height:100%;width:{{ progressW }};border-radius:999px;background:#E0001B;transition:width 300ms ease-out"></div></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
              <span style="font-size:15px;line-height:1.4;color:#4A5260">Набрано із 500 ₴:</span>
              <span style="font-size:15px;line-height:1.4;font-weight:600;color:#E0001B;white-space:nowrap">{{ totalText }}</span>
            </div>
          </div>
        </sc-if>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
          <span style="font-size:15px;line-height:1.4;color:#4A5260">Товарів:</span>
          <span style="font-size:24px;line-height:1.2;font-weight:600;color:#1E232B">{{ count }}</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
          <span style="font-size:15px;line-height:1.4;color:#4A5260">Разом:</span>
          <span style="font-size:24px;line-height:1.2;font-weight:600;color:#1E232B;white-space:nowrap">{{ totalText }}</span>
        </div>
        <button disabled="{{ belowMin }}" onClick="{{ goCheckout }}" style="margin-top:8px;width:100%;height:56px;border:none;border-radius:8px;background:{{ ctaBg }};font:inherit;font-size:16px;font-weight:600;color:{{ ctaColor }};cursor:{{ ctaCursor }};transition:background 150ms ease-out" style-focus="outline:2px solid #1E232B;outline-offset:2px">Оформити замовлення</button>
      </div>
    </sc-if>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;demo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;min&quot;,&quot;full&quot;,&quot;empty&quot;],&quot;tsType&quot;:&quot;'min'|'full'|'empty'|undefined&quot;}}">
const MIN = 500;
const fmt = n => n.toLocaleString('uk-UA').replace(/\u00a0|,/g, ' ') + ' ₴';
const DEMO = {
  min: [{ id: 'MN102574', name: 'Датчик ABS передній лівий', donor: 'Mitsubishi L200 2005–2015', oem: 'MN102574', price: 180, photo: 'assets/part-pickup-hub.jpg' }],
  full: [
    { id: 'MN184022', name: 'Амортизатор задній', donor: 'Mitsubishi L200 2005–2015', oem: 'MN184022', price: 1400, photo: 'assets/part-pickup-hub.jpg' },
    { id: '8301A396', name: 'Фара права', donor: 'Mitsubishi L200 2005–2015', oem: '8301A396', price: 4200, photo: 'assets/part-pickup-hub.jpg' },
    { id: 'UR56-69-180', name: 'Дзеркало ліве електричне', donor: 'Ford Ranger / Mazda BT-50 2006–2012', oem: 'UR56-69-180', price: 2200, photo: 'assets/part-pickup-hub.jpg' }
  ],
  empty: []
};

class Component extends DCLogic {
  state = { open: false, tick: 0 };
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape' && this.state.open) this.close(); };
    window.addEventListener('keydown', this.onKey);
    this.hook();
  }
  hook() {
    if (!window.DLSCart) { this.retry = setTimeout(() => this.hook(), 200); return; }
    this.unsub = window.DLSCart.subscribe(e => {
      if (e.type === 'open') this.open();
      else if (e.type === 'close') this.close();
      else this.setState(s => ({ tick: s.tick + 1 }));
    });
    this.setState(s => ({ tick: s.tick + 1 }));
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKey);
    this.unsub && this.unsub();
    clearTimeout(this.retry); clearTimeout(this.hideTimer);
    document.body.style.overflow = '';
  }
  open() { clearTimeout(this.hideTimer); this.setState({ open: true, mounted: true }); document.body.style.overflow = 'hidden'; }
  close() {
    this.setState({ open: false });
    document.body.style.overflow = '';
    this.hideTimer = setTimeout(() => this.setState({ mounted: false }), 300);
  }
  renderVals() {
    const demo = this.props.demo;
    const isStatic = !!demo;
    const vw = typeof window !== 'undefined' ? window.innerWidth : 1440;
    const m = !isStatic && vw < 768;
    const store = typeof window !== 'undefined' ? window.DLSCart : null;
    const list = isStatic ? (DEMO[demo] || []) : (store ? store.items() : []);
    const total = list.reduce((s, x) => s + (x.price || 0), 0);
    const reached = total >= MIN;
    const open = isStatic || this.state.open;
    const shown = isStatic || this.state.open || this.state.mounted;
    return {
      rootPos: isStatic ? 'absolute' : 'fixed',
      rootEvents: open ? 'auto' : 'none',
      rootVis: shown ? 'visible' : 'hidden',
      overlayOp: open ? 1 : 0,
      panelT: open ? 'translateX(0)' : 'translateX(100%)',
      close: e => { if (e && e.preventDefault) e.preventDefault(); if (!isStatic) this.close(); },
      h2Size: m ? '28px' : '40px',
      headPad: m ? '16px' : '24px 32px',
      listPad: m ? '0 16px' : '0 32px',
      footPad: m ? '16px' : '24px 32px 32px',
      isEmpty: list.length === 0,
      hasItems: list.length > 0,
      items: list.map(x => ({
        ...x, priceText: fmt(x.price || 0),
        remove: () => { if (!isStatic && store) store.remove(x.id); }
      })),
      count: list.length,
      totalText: fmt(total),
      leftText: fmt(Math.max(0, MIN - total)),
      belowMin: !reached,
      minReached: reached,
      progressW: Math.min(100, (total / MIN) * 100) + '%',
      progressColor: reached ? '#1F8A4C' : '#E0001B',
      goCheckout: () => { if (reached) window.location.href = 'DLSCheckout.dc.html'; },
      ctaBg: reached ? '#E0001B' : '#E6E9EE',
      ctaColor: reached ? '#FCFCFD' : '#6B7380',
      ctaCursor: reached ? 'pointer' : 'not-allowed'
    };
  }
}
</script>
</body>
</html>
