<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Про компанію — DLSAuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#12161C;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}input::placeholder{color:#6B7380;opacity:1}</style>
</helmet>
<dc-import name="DLSHeaderHero" hero="{{ false }}" hint-size="100%,168px"></dc-import>
<section ref="{{ heroRef }}" aria-labelledby="about3-h1" data-screen-label="Про компанію — перший екран" style="position:relative;overflow:hidden;isolation:isolate;min-height:{{ minH }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#16141A;font-family:'Golos Text',sans-serif;color:#FCFCFD">
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;pointer-events:none">
    <div style="position:absolute;inset:0">
      <div style="position:absolute;top:-30%;right:-20%;width:70%;height:90%;border-radius:50%;background:radial-gradient(closest-side, rgba(224,0,27,0.35), rgba(224,0,27,0.14) 55%, rgba(224,0,27,0) 100%);filter:blur(80px)"></div>
      <div style="position:absolute;top:-55%;right:-6%;width:46%;height:170%;transform:rotate(42deg);transform-origin:100% 0;background:linear-gradient(180deg, rgba(224,0,27,0.35) 0%, rgba(224,0,27,0.18) 30%, rgba(224,0,27,0) 58%);filter:blur(72px)"></div>
    </div>
    <div style="position:absolute;left:50%;top:{{ spotTop }};width:{{ spotW }};height:{{ spotH }};transform:translate(-50%, -50%);border-radius:50%;background:radial-gradient(closest-side, rgba(92,26,22,0.55), rgba(60,20,20,0.3) 55%, rgba(40,16,18,0) 100%);filter:blur(56px)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:{{ ringsH }}">
      <svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.15;filter:blur(10px)" fill="none" stroke="#E0001B">
        <g transform="translate(0 60) translate(800 330) scale(1 0.24)">
          <circle r="560" stroke-width="6" vector-effect="non-scaling-stroke"></circle>
          <circle r="420" stroke-width="4" vector-effect="non-scaling-stroke"></circle>
          <circle r="168" stroke-width="4" vector-effect="non-scaling-stroke"></circle>
        </g>
      </svg>
      <div style="position:absolute;inset:0;filter:blur(12px);opacity:0.7">
        <svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice" style="display:block;width:100%;height:100%" fill="none" stroke="#E0001B">
          <g transform="translate(800 330) scale(1 0.24)">
            <circle r="560" stroke-width="12" vector-effect="non-scaling-stroke"></circle>
            <circle r="420" stroke-width="7" vector-effect="non-scaling-stroke"></circle>
            <circle r="168" stroke-width="7" vector-effect="non-scaling-stroke"></circle>
          </g>
        </svg>
      </div>
      <div style="position:absolute;left:50%;bottom:{{ discBottom }};width:{{ discD }};height:{{ discD }};margin-left:{{ discML }};perspective:{{ discP }}">
        <div style="position:absolute;inset:0;transform:rotateX(76.1deg)">
          <div ref="{{ spinRef }}" style="position:absolute;inset:0;will-change:transform;transform:translateZ(0) rotate(0deg)">
            <svg viewBox="-600 -600 1200 1200" style="display:block;width:100%;height:100%" fill="none">
              <g stroke="#E0001B" opacity="0.9">
                <circle r="560" stroke-width="6"></circle>
                <circle r="420" stroke-width="3.5"></circle>
                <circle r="168" stroke-width="3.5"></circle>
                <circle cx="0" cy="-105" r="22" stroke-width="3"></circle>
                <circle cx="99.9" cy="-32.4" r="22" stroke-width="3"></circle>
                <circle cx="61.7" cy="84.9" r="22" stroke-width="3"></circle>
                <circle cx="-61.7" cy="84.9" r="22" stroke-width="3"></circle>
                <circle cx="-99.9" cy="-32.4" r="22" stroke-width="3"></circle>
                <g stroke-width="3" stroke-linecap="round"><path d="M440.0 0.0 Q499.3 26.2 533.4 84.5"></path><path d="M433.3 76.4 Q487.2 112.5 510.6 175.8"></path><path d="M413.5 150.5 Q460.3 195.4 472.3 261.8"></path><path d="M381.1 220.0 Q419.3 272.3 419.7 339.8"></path><path d="M337.1 282.8 Q365.7 341.0 354.3 407.5"></path><path d="M282.8 337.1 Q300.9 399.3 278.1 462.9"></path><path d="M220.0 381.1 Q227.0 445.5 193.5 504.1"></path><path d="M150.5 413.5 Q146.2 478.2 103.0 530.1"></path><path d="M76.4 433.3 Q60.9 496.3 9.4 539.9"></path><path d="M0.0 440.0 Q-26.2 499.3 -84.5 533.4"></path><path d="M-76.4 433.3 Q-112.5 487.2 -175.8 510.6"></path><path d="M-150.5 413.5 Q-195.4 460.3 -261.8 472.3"></path><path d="M-220.0 381.1 Q-272.3 419.3 -339.8 419.7"></path><path d="M-282.8 337.1 Q-341.0 365.7 -407.5 354.3"></path><path d="M-337.1 282.8 Q-399.3 300.9 -462.9 278.1"></path><path d="M-381.1 220.0 Q-445.5 227.0 -504.1 193.5"></path><path d="M-413.5 150.5 Q-478.2 146.2 -530.1 103.0"></path><path d="M-433.3 76.4 Q-496.3 60.9 -539.9 9.4"></path><path d="M-440.0 0.0 Q-499.3 -26.2 -533.4 -84.5"></path><path d="M-433.3 -76.4 Q-487.2 -112.5 -510.6 -175.8"></path><path d="M-413.5 -150.5 Q-460.3 -195.4 -472.3 -261.8"></path><path d="M-381.1 -220.0 Q-419.3 -272.3 -419.7 -339.8"></path><path d="M-337.1 -282.8 Q-365.7 -341.0 -354.3 -407.5"></path><path d="M-282.8 -337.1 Q-300.9 -399.3 -278.1 -462.9"></path><path d="M-220.0 -381.1 Q-227.0 -445.5 -193.5 -504.1"></path><path d="M-150.5 -413.5 Q-146.2 -478.2 -103.0 -530.1"></path><path d="M-76.4 -433.3 Q-60.9 -496.3 -9.4 -539.9"></path><path d="M-0.0 -440.0 Q26.2 -499.3 84.5 -533.4"></path><path d="M76.4 -433.3 Q112.5 -487.2 175.8 -510.6"></path><path d="M150.5 -413.5 Q195.4 -460.3 261.8 -472.3"></path><path d="M220.0 -381.1 Q272.3 -419.3 339.8 -419.7"></path><path d="M282.8 -337.1 Q341.0 -365.7 407.5 -354.3"></path><path d="M337.1 -282.8 Q399.3 -300.9 462.9 -278.1"></path><path d="M381.1 -220.0 Q445.5 -227.0 504.1 -193.5"></path><path d="M413.5 -150.5 Q478.2 -146.2 530.1 -103.0"></path><path d="M433.3 -76.4 Q496.3 -60.9 539.9 -9.4"></path></g>
              </g>
              <g stroke="#FF5C6C">
                <circle r="560" stroke-width="2.5"></circle>
                <circle r="420" stroke-width="1.5"></circle>
                <circle r="168" stroke-width="1.5"></circle>
                <circle cx="0" cy="-105" r="22" stroke-width="1.5"></circle>
                <circle cx="99.9" cy="-32.4" r="22" stroke-width="1.5"></circle>
                <circle cx="61.7" cy="84.9" r="22" stroke-width="1.5"></circle>
                <circle cx="-61.7" cy="84.9" r="22" stroke-width="1.5"></circle>
                <circle cx="-99.9" cy="-32.4" r="22" stroke-width="1.5"></circle>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="box-sizing:border-box;width:100%;max-width:{{ contentMax }};margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;align-items:center;text-align:center">
    <h1 id="about3-h1" style="margin:0;font-size:{{ h1Size }};line-height:1.05;font-weight:400;letter-spacing:-0.035em;color:#FCFCFD;text-wrap:balance">
      <span style="display:block;white-space:{{ h1Wrap }};padding-bottom:0.1em;margin-bottom:-0.1em;background:linear-gradient(180deg, #FCFCFD 35%, #A9B0BB 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">Самі купуємо. Самі розбираємо.</span>
      <span style="display:block;padding-bottom:0.1em;margin-bottom:-0.1em;background:linear-gradient(180deg, #FCFCFD 35%, #A9B0BB 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">Самі відповідаємо.</span>
    </h1>
    <p style="margin:{{ textGap }} 0 0;max-width:{{ leadMax }};font-size:{{ textSize }};line-height:1.5;color:rgba(252,252,253,0.75);text-wrap:pretty"><span style="display:{{ leadLine }}">DLSAuto — авторозбірка в Запоріжжі. Купуємо авто після ДТП, </span><span style="display:{{ leadLine }}">перевіряємо кожну деталь і фотографуємо її з усіма дефектами.</span></p>
    <div aria-hidden="true" style="margin-top:{{ btnGap }};height:56px"></div>
  </div>
</section>
<div ref="{{ nextRef }}">
  <dc-import name="DLSStatsNotch" rhythm="{{ true }}" hint-size="100%,860px"></dc-import>
</div>
<dc-import name="DLSPartPath" hint-size="100%,100vh"></dc-import>
<dc-import name="DLSServicesWide" rhythm="{{ true }}" top-pad="{{ true }}" hint-size="100%,1400px"></dc-import>
<dc-import name="DLSTeam" rhythm="{{ true }}" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSReviews" rhythm="{{ true }}" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSVisitCta" rhythm="{{ true }}" hint-size="100%,360px"></dc-import>
<dc-import name="DLSFooter" hint-size="100%,1100px"></dc-import>
<dc-import name="DLSCart" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;}}">
class Component extends DCLogic {
  state = { vw: null };
  heroRef = React.createRef();
  nextRef = React.createRef();
  spinRef = React.createRef();
  inView = true;
  startSpin() {
    const el = this.spinRef.current;
    if (!el || this.spin || !el.animate) return;
    if (this.mq && this.mq.matches) return;
    this.spin = el.animate([{ transform: 'translateZ(0) rotate(0deg)' }, { transform: 'translateZ(0) rotate(360deg)' }], { duration: 24000, iterations: Infinity, easing: 'linear' });
    if (!this.inView) this.spin.pause();
  }
  stopSpin() { if (this.spin) { this.spin.cancel(); this.spin = null; } }
  componentDidUpdate() { this.startSpin(); }

  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth, hw: this.heroRef.current ? this.heroRef.current.clientWidth : null });
    window.addEventListener('resize', this.onResize);
    this.onResize();
    this.mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    this.onMq = () => { this.mq.matches ? this.stopSpin() : this.startSpin(); };
    if (this.mq && this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);
    if ('IntersectionObserver' in window && this.heroRef.current) {
      this.io = new IntersectionObserver(([e]) => {
        this.inView = e.isIntersecting;
        if (this.spin) { if (this.inView) this.spin.play(); else this.spin.pause(); }
      });
      this.io.observe(this.heroRef.current);
    }
    this.startSpin();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    this.stopSpin();
    if (this.io) this.io.disconnect();
    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq);
  }
  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const wide = d === 'desktop' || d === 'laptop';
    const m = d === 'mobile';
    const ringsPx = d === 'desktop' ? 360 : d === 'laptop' ? 320 : d === 'tablet' ? 220 : 140;
    const sc = Math.max((this.state.hw || vw) / 1600, ringsPx / 400);
    const D = Math.round(1120 * sc);
    return {
      heroRef: this.heroRef, nextRef: this.nextRef, spinRef: this.spinRef,
      discD: D + 'px', discML: (-D / 2) + 'px', discBottom: Math.round(70 * sc - D / 2) + 'px', discP: (D * 8) + 'px',
      scrollNext: () => {
        const el = this.nextRef.current;
        if (!el) return;
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: reduce ? 'auto' : 'smooth' });
      },
      minH: wide ? '85vh' : '0px',
      pad: d === 'desktop' ? '96px 64px max(256px, calc(13.75vw + 48px))' : d === 'laptop' ? '96px 32px 240px' : d === 'tablet' ? '64px 32px 208px' : '64px 16px 160px',
      contentMax: 'calc(1312px + ' + (d === 'desktop' ? 128 : m ? 32 : 64) + 'px)',
      h1Size: d === 'desktop' ? '56px' : d === 'laptop' ? '40px' : d === 'tablet' ? '32px' : '28px',
      leadMax: m ? '100%' : '720px',
      leadLine: m ? 'inline' : 'block',
      ringsH: d === 'desktop' ? '360px' : d === 'laptop' ? '320px' : d === 'tablet' ? '220px' : '140px',
      spotTop: wide ? '40%' : '35%',
      spotW: wide ? '70%' : '120%',
      spotH: wide ? '60%' : '50%',
      h1Wrap: wide ? 'nowrap' : 'normal',
      svcHeadPad: d === 'desktop' ? '0 64px 48px' : m ? '0 16px 32px' : '0 32px 48px',
      svcH2: wide ? '40px' : d === 'tablet' ? '28px' : '24px',
      textGap: m ? '24px' : '32px',
      textSize: d === 'desktop' ? '18px' : m ? '14px' : '16px',
      btnGap: m ? '32px' : '48px'
    };
  }
}
</script>
</body>
</html>
