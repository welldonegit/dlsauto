<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<section aria-labelledby="cats-notch-title" data-screen-label="Категорії — виріз" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B">
  <div style="max-width:1312px;margin:0 auto;padding:{{ pad }}">
    <h2 id="cats-notch-title" style="margin:0;font-size:{{ h2Size }};line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1E232B">Категорії запчастин</h2>
    <div style="margin-top:{{ headGap }};display:grid;grid-template-columns:{{ cols }};gap:{{ gap }}">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
        <a href="{{ c.href }}" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" onFocus="{{ c.enter }}" onBlur="{{ c.leave }}" style="position:relative;min-width:0;height:{{ cardH }};box-sizing:border-box;padding:24px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:{{ c.bg }};text-decoration:none;color:{{ c.fg }};outline:none" style-focus="outline:2px solid #1E232B;outline-offset:2px">
          <sc-if value="{{ c.isAll }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;inset:0;border:1px solid #E6E9EE;border-radius:16px;pointer-events:none"></span></sc-if>
          <sc-if value="{{ c.hasZone }}" hint-placeholder-val="{{ true }}">
            <div style="position:relative;flex:none;height:{{ zoneH }};margin:-8px -8px 0;box-sizing:border-box;padding:16px;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{ c.photo }}" hint-placeholder-val="{{ false }}">
                <img src="{{ c.photo }}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:contain;transform:{{ c.scale }};transition:transform 200ms ease-out">
              </sc-if>
              <sc-if value="{{ c.placeholder }}" hint-placeholder-val="{{ false }}">
                <div style="width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:8px;background:repeating-linear-gradient(135deg, rgba(252,252,253,0.06) 0 8px, rgba(252,252,253,0) 8px 16px);transform:{{ c.scale }};transition:transform 200ms ease-out">
                  <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4;color:#A9B0BB;text-align:center">{{ c.placeholder }}</span>
                </div>
              </sc-if>
            </div>
          </sc-if>
          <div style="margin-top:auto;max-width:70%;display:flex;flex-direction:column;gap:4px">
            <h3 style="margin:0;font-size:{{ nameSize }};line-height:1.4;font-weight:600;letter-spacing:-0.01em;color:{{ c.fg }};text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ c.name }}</h3>
            <sc-if value="{{ c.isAll }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;line-height:1.4;color:#6B7380">1 200+ деталей</span></sc-if>
          </div>
          <span aria-hidden="true" style="position:absolute;right:0;bottom:0;width:{{ notch }};height:{{ notch }};box-sizing:border-box;background:#F6F6F6;border-top-left-radius:16px;border-top:1px solid {{ c.ring }};border-left:1px solid {{ c.ring }}"></span>
          <span aria-hidden="true" style="position:absolute;right:0;bottom:{{ filletOff }};width:16px;height:17px;background:radial-gradient(circle at 0 0, {{ c.bg }} 15px, {{ c.ring }} 15px, {{ c.ring }} 16px, #F6F6F6 16.5px)"></span>
          <span aria-hidden="true" style="position:absolute;right:{{ filletOff }};bottom:0;width:17px;height:16px;background:radial-gradient(circle at 0 0, {{ c.bg }} 15px, {{ c.ring }} 15px, {{ c.ring }} 16px, #F6F6F6 16.5px)"></span>
          <span aria-hidden="true" style="position:absolute;right:{{ btnOff }};bottom:{{ btnOff }};width:{{ btn }};height:{{ btn }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1px solid #E0001B;border-radius:50%;background:{{ c.arrowBg }};color:#E0001B;transition:background 200ms ease-out">
            <svg viewBox="0 0 24 24" width="{{ icon }}" height="{{ icon }}" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </span>
        </a>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;},&quot;demoHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const CATS = [
  ['Кузовні деталі', 'kuzov', null, 'Бампер'],
  ['Підвіска та ходова', 'pidviska', 'uploads/cat-suspension2-7e1a2f93.png'],
  ['Електрика та електроніка', 'elektryka', 'uploads/cat-electric2-fe0d4005.png'],
  ['Салон', 'salon', null, 'Двері'],
  ['Оптика', 'optyka', null, 'Фара передня'],
  ['Гальмівна система', 'halma', 'uploads/part-pickup-hub2-f7ae4b05.png'],
  ['Двигуни', 'dvyhuny', 'uploads/cat-engine2-048a39c7.png'],
  ['КПП та роздатки', 'kpp', 'uploads/2-2abd45a8.png'],
  ['Шини та диски', 'shyny', 'uploads/cat-wheels2-62445795.png']
];

class Component extends DCLogic {
  state = { vw: null, hover: null };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const vw = this.state.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const device = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const m = device === 'mobile';
    const d = device === 'desktop';
    const five = d || device === 'laptop';
    const RH = this.props.rhythm ? (five ? 96 : 64) : 0;
    const RG = RH === 96 ? 32 : 24;
    const demo = (this.props.demoHover ?? false) ? 1 : null;
    const N = m ? 64 : 80, B = m ? 40 : 48;
    const mk = (i, isAll) => {
      const on = this.state.hover === i || demo === i;
      return {
        enter: () => this.setState({ hover: i }),
        leave: () => this.setState(s => s.hover === i ? { hover: null } : null),
        scale: on ? 'scale(1.04)' : 'scale(1)',
        arrowBg: on ? 'rgba(224,0,27,0.08)' : 'rgba(224,0,27,0)',
        bg: isAll ? '#FCFCFD' : '#1E232B',
        fg: isAll ? '#1E232B' : '#FCFCFD',
        ring: isAll ? '#E6E9EE' : '#1E232B',
        isAll, hasZone: !isAll
      };
    };
    const cards = CATS.map(([name, slug, photo, ph], i) => ({
      ...mk(i, false), name, href: 'DLSCatalog.dc.html?cat=' + slug, photo: photo || '', placeholder: photo ? '' : ph
    }));
    cards.push({ ...mk(9, true), name: 'Усі категорії', href: 'DLSCatalog.dc.html', photo: '', placeholder: '' });
    return {
      pad: d ? ('0 64px ' + (RH || 100) + 'px') : device === 'mobile' ? ('0 16px ' + (RH || 64) + 'px') : ('0 32px ' + (RH || 75) + 'px'),
      h2Size: d ? '40px' : m ? '24px' : '28px',
      headGap: RH ? RG + 'px' : (m ? '32px' : '48px'),
      cols: five ? 'repeat(5, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))',
      gap: m ? '12px' : '24px',
      cardH: m ? '240px' : '320px',
      zoneH: m ? '128px' : '176px',
      nameSize: m ? '18px' : '20px',
      notch: N + 'px', btn: B + 'px', icon: m ? 16 : 20,
      filletOff: (N - 1) + 'px',
      btnOff: (N - B - 8) + 'px',
      cards
    };
  }
}
</script>
</body>
</html>
