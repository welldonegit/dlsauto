<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>DLSAuto — порівняння, стани</title>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E6E9EE;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<section style="padding:48px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
  <div id="1a" style="display:flex;flex-direction:column;gap:12px">
    <p style="margin:0;font-size:14px;line-height:20px;font-weight:600;color:#1E232B">1a — Таблиця повністю</p>
    <div style="width:1440px;overflow:hidden;border-radius:16px;background:#F6F6F6">
      <dc-import name="DLSCompare" device="desktop" with-footer="{{ false }}" hint-size="1440px,1500px"></dc-import>
    </div>
  </div>
  <div id="1b" style="display:flex;flex-direction:column;gap:12px">
    <p style="margin:0;font-size:14px;line-height:20px;font-weight:600;color:#1E232B">1b — Лише відмінності</p>
    <div style="width:1440px;overflow:hidden;border-radius:16px;background:#F6F6F6">
      <dc-import name="DLSCompare" device="desktop" diff-only="{{ true }}" with-footer="{{ false }}" hint-size="1440px,1200px"></dc-import>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
