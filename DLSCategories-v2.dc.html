<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Golos Text',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<section aria-labelledby="categories-v2-title" data-screen-label="Категорії запчастин — темні картки" style="background:#F6F6F6;font-family:'Golos Text',sans-serif;color:#1E232B">
  <div style="max-width:1312px;margin:0 auto;padding:{{ pad }}">
    <h2 id="categories-v2-title" style="margin:0;font-size:{{ h2Size }};line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#1E232B;text-wrap:balance">Категорії запчастин</h2>
    <div style="margin-top:{{ headGap }};display:grid;grid-template-columns:{{ gridCols }};grid-auto-rows:{{ cardH }};gap:{{ gap }}">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
        <a href="{{ c.href }}" aria-label="{{ c.aria }}" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" onFocus="{{ c.enter }}" onBlur="{{ c.leave }}" onPointerDown="{{ c.down }}" onPointerUp="{{ c.up }}" onPointerLeave="{{ c.up }}" onPointerCancel="{{ c.up }}" style="position:relative;box-sizing:border-box;min-width:0;height:100%;display:block;color:{{ c.ink }};text-decoration:none;border-radius:16px" style-focus="outline:2px solid #1E232B;outline-offset:2px">
          <div aria-hidden="true" style="position:absolute;inset:0;border-radius:16px;background:{{ c.edge }};-webkit-mask:{{ notchMask }};mask:{{ notchMask }}"></div>
          <div aria-hidden="true" style="position:absolute;inset:1px;border-radius:15px;background:{{ c.bg }};-webkit-mask:{{ innerMask }};mask:{{ innerMask }}"></div>
          <div style="position:relative;box-sizing:border-box;height:100%;padding:{{ cardPad }};display:flex;flex-direction:column">
            <sc-if value="{{ c.hasPhoto }}" hint-placeholder-val="{{ true }}">
              <div style="flex:0 1 {{ zoneH }};min-height:{{ zoneMin }};box-sizing:border-box;padding:16px;overflow:hidden">
                <div style="width:100%;height:100%;overflow:hidden;border-radius:8px;background:#FCFCFD;transform:{{ c.scale }};transition:transform 200ms cubic-bezier(0.22, 1, 0.36, 1)">
                  <img src="{{ c.src }}" alt="{{ c.alt }}" style="display:block;width:100%;height:100%;object-fit:contain">
                </div>
              </div>
            </sc-if>
            <div style="margin-top:auto;max-width:{{ titleMax }};display:flex;flex-direction:column;gap:4px">
              <h3 style="margin:0;font-size:{{ titleSize }};line-height:{{ titleLh }};font-weight:600;letter-spacing:-0.01em;color:{{ c.ink }};text-wrap:balance;overflow-wrap:break-word;hyphens:auto" lang="uk">{{ c.name }}</h3>
              <sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;line-height:20px;color:#4A5260">{{ c.sub }}</span></sc-if>
            </div>
          </div>
          <span aria-hidden="true" style="position:absolute;right:{{ arrowOff }};bottom:{{ arrowOff }};width:{{ arrowS }};height:{{ arrowS }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1px solid #E0001B;border-radius:50%;background:{{ c.arrowBg }};color:#E0001B;transition:background 150ms ease-out"><svg viewBox="0 0 24 24" width="{{ iconS }}" height="{{ iconS }}" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </a>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;laptop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;tsType&quot;:&quot;'desktop'|'laptop'|'tablet'|'mobile'&quot;}}">
const CATS = [
  ['Кузовні деталі', 'передній бампер', 'kuzov', 'assets/cat-body.jpg'],
  ['Підвіска та ходова', 'амортизатор із пружиною', 'pidviska', 'assets/cat-suspension.jpg'],
  ['Електрика та електроніка', 'блок керування двигуном', 'elektryka', 'assets/cat-electric.jpg'],
  ['Салон', 'водійське сидіння', 'salon', 'assets/part-pickup-hub.jpg'],
  ['Оптика', 'фара в зборі', 'optyka', 'assets/part-pickup-hub.jpg'],
  ['Гальмівна система', 'супорт із диском', 'halma', 'assets/part-pickup-hub.jpg'],
  ['Двигуни', 'двигун на підставці', 'dvyhuny', 'assets/cat-engine.jpg'],
  ['КПП та роздатки', 'автоматична КПП', 'kpp', 'assets/cat-gearbox.jpg'],
  ['Шини та диски', 'литий диск із шиною', 'shyny', 'assets/cat-wheels.jpg']
];
const ARROW_BG = { rest: 'rgba(224,0,27,0)', hover: 'rgba(224,0,27,0.08)', press: 'rgba(224,0,27,0.12)' };
// Bottom-right notch: N×N cut away; card corners beside it rounded (Rv), the inner corner of the cut concave (Rc).
const notch = (N, Rv, Rc) => {
  const sq = 'linear-gradient(#000, #000)';
  const disc = r => `radial-gradient(circle at 0 0, #000 ${r - 0.5}px, transparent ${r}px)`;
  return [
    `${sq} left 0 top 0 / calc(100% - ${N + Rv}px) 100% no-repeat`,
    `${sq} left 0 top 0 / 100% calc(100% - ${N + Rv}px) no-repeat`,
    `${sq} right ${N}px top 0 / ${Rv}px calc(100% - ${Rv}px) no-repeat`,
    `${disc(Rv)} right ${N}px bottom 0 / ${Rv}px ${Rv}px no-repeat`,
    `${sq} right ${Rv}px bottom ${N}px / ${N - Rv}px ${Rv}px no-repeat`,
    `${disc(Rv)} right 0 bottom ${N}px / ${Rv}px ${Rv}px no-repeat`,
    `radial-gradient(circle at 100% 100%, transparent ${Rc - 0.5}px, #000 ${Rc}px) right ${N - Rc}px bottom ${N - Rc}px / ${Rc}px ${Rc}px no-repeat`
  ].join(', ');
};

class Component extends DCLogic {
  state = { vw: null, hc: -1, pk: -1 };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }
  renderVals() {
    const s = this.state;
    const vw = s.vw ?? (typeof window !== 'undefined' ? window.innerWidth : 1440);
    const d = this.props.device ?? (vw >= 1360 ? 'desktop' : vw >= 1024 ? 'laptop' : vw >= 768 ? 'tablet' : 'mobile');
    const m = d === 'mobile';
    const cols = d === 'desktop' ? 5 : d === 'laptop' ? (vw >= 1280 ? 5 : 4) : d === 'tablet' ? 3 : 2;
    const N = m ? 64 : 80, A = m ? 40 : 48, R = 16;
    const card = (i, extra) => ({
      enter: () => this.setState({ hc: i }),
      leave: () => this.setState(x => (x.hc === i ? { hc: -1 } : null)),
      down: () => this.setState({ pk: i }),
      up: () => this.setState(x => (x.pk === i ? { pk: -1 } : null)),
      arrowBg: s.pk === i ? ARROW_BG.press : s.hc === i ? ARROW_BG.hover : ARROW_BG.rest,
      ...extra
    });
    const cards = CATS.map(([name, alt, slug, src], i) => card(i, {
      name, href: `DLSCatalog.dc.html?category=${slug}`, aria: name,
      hasPhoto: true, src, alt,
      scale: s.hc === i ? 'scale(1.04)' : 'scale(1)',
      edge: '#1E232B', bg: '#1E232B', ink: '#F3F5F7', hasSub: false, sub: ''
    }));
    cards.push(card(99, {
      name: 'Усі категорії', href: 'DLSCatalog.dc.html', aria: 'Усі категорії, 1 200+ деталей',
      hasPhoto: false, scale: 'none',
      edge: '#E6E9EE', bg: '#FCFCFD', ink: '#1E232B', hasSub: true, sub: '1 200+ деталей'
    }));
    return {
      pad: d === 'desktop' ? '0 64px 100px' : m ? '0 16px 75px' : '0 32px 75px',
      h2Size: d === 'desktop' ? '40px' : m ? '24px' : '28px',
      headGap: m ? '32px' : '48px',
      gridCols: `repeat(${cols}, minmax(0, 1fr))`,
      cardH: m ? '240px' : '320px',
      gap: m ? '16px' : '24px',
      cardPad: m ? '16px' : '24px',
      zoneH: m ? '128px' : '176px',
      // long titles (3–4 lines) may take height from the photo zone instead of overflowing the card
      zoneMin: m ? '72px' : '112px',
      titleSize: m ? '18px' : '20px', titleLh: m ? '24px' : '28px',
      notchMask: notch(N, R, R),
      innerMask: notch(N, R - 1, R + 1),
      arrowS: A + 'px', iconS: m ? '16' : '20',
      arrowOff: (N - A) / 2 + 'px',
      titleMax: `calc(100% - ${N - (m ? 16 : 24)}px)`,
      cards
    };
  }
}
</script>
</body>
</html>
