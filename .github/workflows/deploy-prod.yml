name: Deploy prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix (lowercase)
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.prefix }}-web:latest
            ${{ steps.img.outputs.prefix }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.prefix }}-worker:latest
            ${{ steps.img.outputs.prefix }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Trigger Dokploy redeploy
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_PROD_WEBHOOK }}"
